[workspace]
resolver = "2"
members = ["kernel"]
exclude = ["arceos", "vendor/axconfig-gen", "vendor/cargo-binutils"]

[workspace.package]
version = "0.2.0-preview.2"
edition = "2024"
description = "A Linux-compatible OS kernel built on ArceOS unikernel"
license = "Apache-2.0"

authors = [
    "Azure-stars <Azure_stars@126.com>",
    "Yuekai Jia <equation618@gmail.com>",
    "KylinSoft Co., Ltd. <https://www.kylinos.cn/>",
    "朝倉水希 <asakuramizu111@gmail.com>",
    "Mivik <mivikq@gmail.com>",
]
homepage = "https://github.com/Starry-OS"
repository = "https://github.com/Starry-OS/StarryOS"

[workspace.dependencies]
axfeat = { version = "=0.2.2-preview.1" }

axalloc = { version = "=0.2.2-preview.1" }
axconfig = { version = "=0.2.2-preview.1" }
axdisplay = { version = "=0.2.2-preview.1" }
axdriver = { version = "=0.2.2-preview.1" }
axfs = { version = "=0.2.2-preview.1" }
axhal = { version = "=0.2.2-preview.4" }
axipi = { version = "=0.2.2-preview.2" }
axinput = { version = "=0.2.2-preview.1" }
axlog = { version = "=0.2.2-preview.1" }
axmm = { version = "=0.2.2-preview.1" }
axruntime = { version = "=0.2.2-preview.2" }
axsync = { version = "=0.2.2-preview.1" }
axtask = { version = "=0.2.2-preview.3" }
axcpu = { version = "=0.3.0-preview.3" }
heapless = { version = "0.9.1" }

starry-kernel = { path = "kernel", version = "0.2.0-preview.2" }

[package]
name = "starryos"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
qemu = [
    "axfeat/defplat",
    "axfeat/bus-pci",
    "starry-kernel/net",
]
ls2k1000 = [
    "axfeat/myplat",
    "axfeat/driver-ls2k1000",
    "starry-kernel/net",
    "starry-kernel/ls2k1000",
    "dep:axplat-loongarch64-ls2k1000",
    "axplat-loongarch64-ls2k1000/fp-simd",
    "axplat-loongarch64-ls2k1000/irq",
    "axplat-loongarch64-ls2k1000/rtc",
    "axplat-loongarch64-ls2k1000/smp",
]
shell-init = []
pre-init = []
smp = ["axfeat/smp"]

vf2 = [
    "axfeat/myplat",
    "axfeat/driver-jh7110",
    "axfeat/driver-sdmmc-irq",
    "axfeat/ipi",
    "starry-kernel/net",
    "dep:axplat-riscv64-visionfive2",
    "axplat-riscv64-visionfive2/fp-simd",
    "axplat-riscv64-visionfive2/irq",
    "axplat-riscv64-visionfive2/smp",
]

[[bin]]
name = "starryos"
path = "src/main.rs"

[dependencies]
axfeat.workspace = true
starry-kernel.workspace = true
axplat-loongarch64-ls2k1000 = { path = "vendor/axplat-loongarch64-ls2k1000", optional = true }
axplat-riscv64-visionfive2 = { path = "vendor/axplat-riscv64-visionfive2", optional = true }

[patch.crates-io]
axcpu = { path = "vendor/axcpu" }
axfeat = { path = "vendor/axfeat" }
axdriver = { path = "vendor/axdriver" }
axdriver_block = { path = "vendor/axdriver_block" }
axdriver_net = { path = "vendor/axdriver_net" }
axdriver_virtio = { path = "vendor/axdriver_virtio" }
axhal = { path = "vendor/axhal" }
axplat = { path = "vendor/axplat" }
axfs = { path = "vendor/axfs" }
axmm = { path = "vendor/axmm" }
axruntime = { path = "vendor/axruntime" }
axfs-ng-vfs = { path = "vendor/axfs-ng-vfs" }
kernel-elf-parser = { path = "vendor/kernel-elf-parser" }
memory_set = { path = "vendor/memory_set" }
page_table_entry = { path = "vendor/page_table_entry" }
page_table_multiarch = { path = "vendor/page_table_multiarch" }
lwext4_rust = { path = "third_party/lwext4_rust" }
starry-smoltcp = { path = "vendor/starry-smoltcp" }
starry-process = { path = "vendor/starry-process" }
starry-signal = { path = "vendor/starry-signal" }
simple-sdmmc = { path = "vendor/simple-sdmmc" }
virtio-drivers = { path = "vendor/virtio-drivers" }

[package.metadata.vendor-filter]
platforms = ["riscv64gc-unknown-none-elf", "loongarch64-unknown-none-softfloat"]
all-features = true
