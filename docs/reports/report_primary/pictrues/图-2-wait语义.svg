<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268"
     viewBox="0 0 760 268"
     font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#aaa"/>
    </marker>
  </defs>

  <rect width="760" height="268" fill="none"/>

  <!-- 时间轴 -->
  <line x1="50" y1="24" x2="710" y2="24" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="718" y="28" font-size="11" fill="#bbb">时间</text>

  <!-- 子进程标签 -->
  <text x="28" y="113" font-size="12" fill="#444" text-anchor="middle" font-weight="bold">子进程</text>

  <!-- 状态盒子 -->
  <rect x="50"  y="90" width="145" height="36" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="122" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a2d">运行中</text>

  <rect x="195" y="90" width="180" height="36" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="285" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#7d6000">已停止</text>

  <rect x="375" y="90" width="155" height="36" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="452" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d6a2d">运行中</text>

  <rect x="530" y="90" width="88"  height="36" fill="#ffe6cc" stroke="#d6a000" stroke-width="1.5"/>
  <text x="574" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#7d4000">僵尸</text>

  <!-- 终止标记 -->
  <line x1="618" y1="90" x2="618" y2="126" stroke="#bbb" stroke-width="2"/>
  <circle cx="618" cy="108" r="5" fill="#bbb"/>

  <!-- 转换事件标签（盒子上方） -->
  <text x="195" y="80" text-anchor="middle" font-size="10" fill="#888">SIGSTOP</text>
  <text x="375" y="80" text-anchor="middle" font-size="10" fill="#888">SIGCONT</text>
  <text x="530" y="80" text-anchor="middle" font-size="10" fill="#888">exit()</text>
  <text x="618" y="80" text-anchor="middle" font-size="10" fill="#bbb">回收</text>

  <!-- 虚线连接 -->
  <line x1="195" y1="126" x2="195" y2="168" stroke="#d6b656" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="375" y1="126" x2="375" y2="168" stroke="#82b366" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="530" y1="126" x2="530" y2="168" stroke="#d6a000" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- 父进程标签 -->
  <text x="28" y="186" font-size="12" fill="#444" text-anchor="middle" font-weight="bold">父进程</text>

  <!-- 父进程基线 -->
  <line x1="50" y1="183" x2="660" y2="183" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- 父进程 wait 盒子，各自居中于对应事件 x -->
  <rect x="134" y="168" width="122" height="30" rx="4" fill="#fffde7" stroke="#d6b656" stroke-width="1.2"/>
  <text x="195" y="187" text-anchor="middle" font-size="11" fill="#7d6000">wait(WUNTRACED)</text>

  <rect x="310" y="168" width="130" height="30" rx="4" fill="#e8f5e9" stroke="#82b366" stroke-width="1.2"/>
  <text x="375" y="187" text-anchor="middle" font-size="11" fill="#2d6a2d">wait(WCONTINUED)</text>

  <rect x="496" y="168" width="68"  height="30" rx="4" fill="#fff3e0" stroke="#d6a000" stroke-width="1.2"/>
  <text x="530" y="187" text-anchor="middle" font-size="11" fill="#7d4000">wait()</text>

  <!-- 结果说明 -->
  <text x="195" y="212" text-anchor="middle" font-size="10" fill="#888">感知 Stopped 事件</text>
  <text x="195" y="224" text-anchor="middle" font-size="10" fill="#888">子进程仍存在</text>

  <text x="375" y="212" text-anchor="middle" font-size="10" fill="#888">感知 Continued 事件</text>
  <text x="375" y="224" text-anchor="middle" font-size="10" fill="#888">子进程仍存在</text>

  <text x="530" y="212" text-anchor="middle" font-size="10" fill="#888">读取退出码</text>
  <text x="530" y="224" text-anchor="middle" font-size="10" fill="#888">子进程被回收</text>

  <!-- WNOWAIT 注 -->
  <text x="50" y="252" font-size="10" fill="#bbb" font-style="italic">注：WNOWAIT 可读取上述任意事件但不消费，同一事件后续仍可再次查询。</text>
</svg>
