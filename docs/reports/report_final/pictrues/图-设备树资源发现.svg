<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">设备树传递与硬件资源发现</title>
  <desc id="desc">固件传入 DTB，内核完成早期映射和解析，再分别初始化内存、平台和设备资源。</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#26395d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60728f"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; fill: #24334d; }
      .label { font-size: 18px; font-weight: 650; }
      .small { font-size: 15px; fill: #52627d; }
      .line { fill: none; stroke: #60728f; stroke-width: 2.2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #60728f; stroke-width: 2; }
    </style>
  </defs>

  <rect width="960" height="500" rx="18" fill="#fbfcff"/>

  <g filter="url(#shadow)">
    <rect x="50" y="50" width="190" height="72" rx="14" fill="#f5eefb" stroke="#a58ac1" stroke-width="1.6"/>
    <text x="145" y="79" text-anchor="middle" class="label">OpenSBI / U-Boot</text>
    <text x="145" y="103" text-anchor="middle" class="small">DTB 物理地址</text>

    <rect x="295" y="50" width="190" height="72" rx="14" fill="#e8f0fc" stroke="#8ba9d6" stroke-width="1.6"/>
    <text x="390" y="79" text-anchor="middle" class="label">早期启动</text>
    <text x="390" y="103" text-anchor="middle" class="small">映射与保留 DTB</text>

    <rect x="540" y="50" width="190" height="72" rx="14" fill="#eaf7f3" stroke="#70ad9c" stroke-width="1.6"/>
    <text x="635" y="79" text-anchor="middle" class="label">axhal::dtb</text>
    <text x="635" y="103" text-anchor="middle" class="small">统一解析入口</text>

    <rect x="785" y="50" width="125" height="72" rx="14" fill="#fbf2e8" stroke="#c69a67" stroke-width="1.6"/>
    <text x="847.5" y="79" text-anchor="middle" class="label">FDT</text>
    <text x="847.5" y="103" text-anchor="middle" class="small">节点与属性</text>
  </g>

  <path d="M240 86 H289" class="line"/>
  <path d="M485 86 H534" class="line"/>
  <path d="M730 86 H779" class="line"/>

  <path d="M635 122 V170" class="branch"/>
  <path d="M190 170 H780" class="branch"/>

  <g filter="url(#shadow)">
    <rect x="85" y="190" width="210" height="94" rx="14" fill="#eef6ff" stroke="#79a5d2" stroke-width="1.6"/>
    <text x="190" y="220" text-anchor="middle" class="label">CPU 与内存</text>
    <text x="190" y="247" text-anchor="middle" class="small">hart / CPU 拓扑</text>
    <text x="190" y="269" text-anchor="middle" class="small">RAM 与保留区</text>

    <rect x="375" y="190" width="210" height="94" rx="14" fill="#eef2fb" stroke="#8296c4" stroke-width="1.6"/>
    <text x="480" y="220" text-anchor="middle" class="label">平台资源</text>
    <text x="480" y="247" text-anchor="middle" class="small">UART / IRQ / RTC</text>
    <text x="480" y="269" text-anchor="middle" class="small">watchdog / syscon</text>

    <rect x="665" y="190" width="210" height="94" rx="14" fill="#f5f0fb" stroke="#9a83bb" stroke-width="1.6"/>
    <text x="770" y="220" text-anchor="middle" class="label">设备资源</text>
    <text x="770" y="247" text-anchor="middle" class="small">AHCI / GMAC / PHY</text>
    <text x="770" y="269" text-anchor="middle" class="small">MMIO / IRQ / DMA</text>
  </g>

  <path d="M190 170 V184" class="line"/>
  <path d="M480 170 V184" class="line"/>
  <path d="M770 170 V184" class="line"/>

  <path d="M190 284 V327" class="branch"/>
  <path d="M480 284 V327" class="branch"/>
  <path d="M770 284 V327" class="branch"/>
  <path d="M190 327 H770" class="branch"/>
  <path d="M480 327 V354" class="line"/>

  <g filter="url(#shadow)">
    <rect x="210" y="360" width="540" height="88" rx="15" fill="#eaf7f3" stroke="#70ad9c" stroke-width="1.7"/>
    <text x="480" y="394" text-anchor="middle" class="label">完成平台初始化</text>
    <text x="480" y="422" text-anchor="middle" class="small">内存布局　·　中断拓扑　·　设备注册</text>
  </g>
</svg>
