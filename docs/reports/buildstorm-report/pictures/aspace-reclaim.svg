<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#64748b" flood-opacity="0.16"/></filter>
    <style>
      text { font-family: KaiTi, STKaiti, 楷体, serif; }
      .latin { font-family: "Times New Roman", Times, serif; }
      .row { stroke-width: 1.5; }
      .node { stroke-width: 1.5; }
      .row-label { font-size: 22px; font-weight: 700; }
      .node-text { font-size: 20px; }
      .small { font-size: 18px; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="700" rx="10" fill="#ffffff"/>

  <!-- old synchronous reclaim, wrapped -->
  <rect class="row" x="12" y="16" width="1096" height="320" rx="12" fill="#fff8f7" stroke="#f1b6ae"/>
  <rect x="24" y="126" width="104" height="100" rx="10" fill="#fff0ee" stroke="#df6b5d" stroke-width="1.5"/>
  <text class="row-label" x="76" y="165" text-anchor="middle" fill="#b84437">旧链路</text><text class="small" x="76" y="192" text-anchor="middle" fill="#b84437">前台逐页</text>
  <g filter="url(#shadow)">
    <rect class="node" x="160" y="55" width="170" height="70" rx="9" fill="#f8fafc" stroke="#94a3b8"/>
    <text class="node-text latin" x="245" y="84" text-anchor="middle" fill="#334155">exit / exec</text><text class="small" x="245" y="109" text-anchor="middle" fill="#334155">前台线程</text>
    <rect class="node" x="390" y="55" width="170" height="70" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="node-text" x="475" y="84" text-anchor="middle" fill="#69428b">获取 <tspan class="latin">AddrSpace</tspan></text><text class="small" x="475" y="109" text-anchor="middle" fill="#69428b">写锁</text>
    <rect class="node" x="620" y="55" width="170" height="70" rx="9" fill="#fff1ef" stroke="#df6b5d"/>
    <text class="node-text" x="705" y="84" text-anchor="middle" fill="#b84437">逐个 <tspan class="latin">area</tspan></text><text class="small" x="705" y="109" text-anchor="middle" fill="#b84437">遍历虚拟区间</text>
    <rect class="node" x="850" y="55" width="170" height="70" rx="9" fill="#ffe5e1" stroke="#d65243"/>
    <text class="node-text" x="935" y="84" text-anchor="middle" fill="#aa362b">逐 <tspan class="latin">4 KiB</tspan> 页面</text><text class="small" x="935" y="109" text-anchor="middle" fill="#aa362b">盲扫整个区间</text>

    <rect class="node" x="850" y="215" width="170" height="70" rx="9" fill="#fff1ef" stroke="#df6b5d"/>
    <text class="node-text" x="935" y="244" text-anchor="middle" fill="#b84437">每页清除 <tspan class="latin">PTE</tspan></text><text class="small latin" x="935" y="269" text-anchor="middle" fill="#b84437">pt.unmap</text>
    <rect class="node" x="620" y="215" width="170" height="70" rx="9" fill="#ffe5e1" stroke="#d65243"/>
    <text class="node-text" x="705" y="244" text-anchor="middle" fill="#aa362b">每页完成修改</text><text class="small latin" x="705" y="269" text-anchor="middle" fill="#aa362b">pt.finish</text>
    <rect class="node" x="390" y="215" width="170" height="70" rx="9" fill="#ffe5e1" stroke="#d65243"/>
    <text class="node-text" x="475" y="244" text-anchor="middle" fill="#aa362b">全核 <tspan class="latin">TLB</tspan> 刷新</text><text class="small latin" x="475" y="269" text-anchor="middle" fill="#aa362b">shootdown</text>
    <rect class="node" x="160" y="215" width="170" height="70" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="node-text" x="245" y="244" text-anchor="middle" fill="#69428b">逐页释放</text><text class="small latin" x="245" y="269" text-anchor="middle" fill="#69428b">frame / folio</text>
  </g>
  <path class="arrow" d="M330 90 H382"/><path class="arrow" d="M560 90 H612"/><path class="arrow" d="M790 90 H842"/>
  <path class="arrow" d="M935 125 V207"/><path class="arrow" d="M850 250 H798"/><path class="arrow" d="M620 250 H568"/><path class="arrow" d="M390 250 H338"/>

  <!-- new asynchronous batched reclaim, wrapped -->
  <rect class="row" x="12" y="364" width="1096" height="320" rx="12" fill="#f5fbf7" stroke="#a9d9b9"/>
  <rect x="24" y="474" width="104" height="100" rx="10" fill="#e9f8ef" stroke="#48a86b" stroke-width="1.5"/>
  <text class="row-label" x="76" y="513" text-anchor="middle" fill="#25824a">新链路</text><text class="small" x="76" y="540" text-anchor="middle" fill="#25824a">异步批量</text>
  <g filter="url(#shadow)">
    <rect class="node" x="140" y="403" width="150" height="70" rx="9" fill="#f8fafc" stroke="#94a3b8"/>
    <text class="node-text latin" x="215" y="432" text-anchor="middle" fill="#334155">exit / exec</text><text class="small" x="215" y="457" text-anchor="middle" fill="#334155">前台线程</text>
    <rect class="node" x="335" y="403" width="150" height="70" rx="9" fill="#edf5ff" stroke="#5d8ec4"/>
    <text class="node-text" x="410" y="432" text-anchor="middle" fill="#356a9c">延迟回收</text><text class="small" x="410" y="457" text-anchor="middle" fill="#356a9c">提交地址空间</text>
    <rect class="node" x="530" y="403" width="150" height="70" rx="9" fill="#edf5ff" stroke="#5d8ec4"/>
    <text class="node-text" x="605" y="432" text-anchor="middle" fill="#356a9c">加入回收队列</text><text class="small" x="605" y="457" text-anchor="middle" fill="#356a9c">前台立即返回</text>
    <rect class="node" x="725" y="403" width="150" height="70" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="node-text latin" x="800" y="432" text-anchor="middle" fill="#69428b">worker</text><text class="small" x="800" y="457" text-anchor="middle" fill="#69428b">获取写锁并回收</text>
    <rect class="node" x="920" y="403" width="150" height="70" rx="9" fill="#e7f8ed" stroke="#48a86b"/>
    <text class="node-text" x="995" y="432" text-anchor="middle" fill="#25824a">跳到驻留页</text><text class="small" x="995" y="457" text-anchor="middle" fill="#25824a">跳过空洞区间</text>

    <rect class="node" x="850" y="563" width="170" height="70" rx="9" fill="#e7f8ed" stroke="#48a86b"/>
    <text class="node-text" x="935" y="592" text-anchor="middle" fill="#25824a">清除 <tspan class="latin">PTE</tspan></text><text class="small" x="935" y="617" text-anchor="middle" fill="#25824a">保留页引用</text>
    <rect class="node" x="620" y="563" width="170" height="70" rx="9" fill="#e7f8ed" stroke="#48a86b"/>
    <text class="node-text latin" x="705" y="592" text-anchor="middle" fill="#25824a">UnmapGather</text><text class="small" x="705" y="617" text-anchor="middle" fill="#25824a">累积 <tspan class="latin">8192</tspan> 项</text>
    <rect class="node" x="390" y="563" width="170" height="70" rx="9" fill="#fff4e8" stroke="#cf813c"/>
    <text class="node-text latin" x="475" y="592" text-anchor="middle" fill="#9a571f">active-root</text><text class="small" x="475" y="617" text-anchor="middle" fill="#9a571f">定向 <tspan class="latin">TLB</tspan> 刷新</text>
    <rect class="node" x="160" y="563" width="170" height="70" rx="9" fill="#e7f8ed" stroke="#48a86b"/>
    <text class="node-text" x="245" y="592" text-anchor="middle" fill="#25824a">批量释放</text><text class="small latin" x="245" y="617" text-anchor="middle" fill="#25824a">frame / folio</text>
  </g>
  <path class="arrow" d="M290 438 H327"/><path class="arrow" d="M485 438 H522"/><path class="arrow" d="M680 438 H717"/><path class="arrow" d="M875 438 H912"/>
  <path class="arrow" d="M995 473 V520 H935 V555"/><path class="arrow" d="M850 598 H798"/><path class="arrow" d="M620 598 H568"/><path class="arrow" d="M390 598 H338"/>
</svg>
