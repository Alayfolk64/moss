<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
    <style>
      .cn { font-family: KaiTi, STKaiti, 楷体, serif; }
      .latin { font-family: "Times New Roman", Times, serif; }
      .row { stroke-width: 1.5; }
      .node { stroke-width: 1.5; }
      .label { font-size: 22px; font-weight: 700; }
      .node-text { font-size: 19px; }
      .small-text { font-size: 18px; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="510" rx="10" fill="#ffffff"/>

  <!-- old path -->
  <rect class="row" x="12" y="16" width="1096" height="122" rx="12" fill="#fff8f7" stroke="#f1b6ae"/>
  <rect x="22" y="38" width="82" height="76" rx="10" fill="#fff0ee" stroke="#df6b5d" stroke-width="1.5"/>
  <text class="cn label" x="63" y="70" text-anchor="middle" fill="#b84437">旧链路</text>
  <text class="cn small-text" x="63" y="94" text-anchor="middle" fill="#b84437">锁内等待</text>

  <g filter="url(#shadow)">
    <rect class="node" x="126" y="46" width="124" height="62" rx="9" fill="#f8fafc" stroke="#94a3b8"/>
    <text class="cn node-text" x="188" y="83" text-anchor="middle" fill="#334155">文件读取请求</text>

    <rect class="node" x="278" y="46" width="124" height="62" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="cn node-text" x="340" y="74" text-anchor="middle" fill="#69428b">获取 <tspan class="latin">ext4</tspan> 锁</text>
    <text class="cn small-text" x="340" y="96" text-anchor="middle" fill="#69428b">进入临界区</text>

    <rect class="node" x="430" y="46" width="124" height="62" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="cn node-text" x="492" y="74" text-anchor="middle" fill="#69428b">查询 <tspan class="latin">extent</tspan></text>
    <text class="cn small-text" x="492" y="96" text-anchor="middle" fill="#69428b">映射关系</text>

    <rect class="node" x="582" y="46" width="124" height="62" rx="9" fill="#fff1ef" stroke="#df6b5d"/>
    <text class="cn node-text" x="644" y="74" text-anchor="middle" fill="#b84437">提交数据 <tspan class="latin">I/O</tspan></text>
    <text class="cn small-text" x="644" y="96" text-anchor="middle" fill="#b84437">持锁等待</text>

    <rect class="node" x="734" y="46" width="124" height="62" rx="9" fill="#ffe5e1" stroke="#d65243"/>
    <text class="cn node-text" x="796" y="83" text-anchor="middle" fill="#aa362b">等待磁盘</text>

    <rect class="node" x="886" y="46" width="124" height="62" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="cn node-text" x="948" y="83" text-anchor="middle" fill="#69428b">释放 <tspan class="latin">ext4</tspan> 锁</text>
  </g>

  <path class="arrow" d="M250 77 H272"/>
  <path class="arrow" d="M402 77 H424"/>
  <path class="arrow" d="M554 77 H576"/>
  <path class="arrow" d="M706 77 H728"/>
  <path class="arrow" d="M858 77 H880"/>

  <!-- new path: four nodes per line -->
  <rect class="row" x="12" y="178" width="1096" height="314" rx="12" fill="#f5fbf7" stroke="#a9d9b9"/>
  <rect x="22" y="285" width="82" height="92" rx="10" fill="#e9f8ef" stroke="#48a86b" stroke-width="1.5"/>
  <text class="cn label" x="63" y="321" text-anchor="middle" fill="#25824a">新链路</text>
  <text class="cn small-text" x="63" y="347" text-anchor="middle" fill="#25824a">锁外读盘</text>

  <g filter="url(#shadow)">
    <rect class="node" x="160" y="216" width="170" height="70" rx="9" fill="#edf5ff" stroke="#5d8ec4"/>
    <text class="cn node-text" x="245" y="245" text-anchor="middle" fill="#356a9c">读取请求 / 查缓存</text><text class="cn small-text" x="245" y="270" text-anchor="middle" fill="#356a9c">无锁查询 <tspan class="latin">extent</tspan></text>
    <rect class="node" x="390" y="216" width="170" height="70" rx="9" fill="#edf5ff" stroke="#5d8ec4"/>
    <text class="cn node-text" x="475" y="245" text-anchor="middle" fill="#356a9c">缓存未命中</text><text class="cn small-text" x="475" y="270" text-anchor="middle" fill="#356a9c">计算 <tspan class="latin">lookahead</tspan></text>
    <rect class="node" x="620" y="216" width="170" height="70" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="cn node-text" x="705" y="245" text-anchor="middle" fill="#69428b">获取锁 / 再查缓存</text><text class="cn small-text" x="705" y="270" text-anchor="middle" fill="#69428b"><tspan class="latin">ext4</tspan> 短临界区</text>
    <rect class="node" x="850" y="216" width="170" height="70" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="cn node-text" x="935" y="245" text-anchor="middle" fill="#69428b">查询 <tspan class="latin">extent</tspan> 树</text><text class="cn small-text" x="935" y="270" text-anchor="middle" fill="#69428b">准备直接 <tspan class="latin">I/O</tspan></text>

    <rect class="node" x="850" y="370" width="170" height="70" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="cn node-text" x="935" y="411" text-anchor="middle" fill="#69428b">释放 <tspan class="latin">ext4</tspan> 锁</text>
    <rect class="node" x="620" y="370" width="170" height="70" rx="9" fill="#e7f8ed" stroke="#48a86b"/>
    <text class="cn node-text" x="705" y="399" text-anchor="middle" fill="#25824a">记录 <tspan class="latin">extent</tspan></text><text class="cn small-text" x="705" y="424" text-anchor="middle" fill="#25824a">映射缓存</text>
    <rect class="node" x="390" y="370" width="170" height="70" rx="9" fill="#e7f8ed" stroke="#48a86b"/>
    <text class="cn node-text" x="475" y="399" text-anchor="middle" fill="#25824a">返回映射</text><text class="cn small-text" x="475" y="424" text-anchor="middle" fill="#25824a">交给调用方</text>
    <rect class="node" x="160" y="370" width="170" height="70" rx="9" fill="#e7f8ed" stroke="#48a86b"/>
    <text class="cn node-text" x="245" y="399" text-anchor="middle" fill="#25824a">锁外读取</text><text class="cn small-text latin" x="245" y="424" text-anchor="middle" fill="#25824a">disk.read_blocks</text>
  </g>
  <path class="arrow" d="M330 251 H382"/><path class="arrow" d="M560 251 H612"/><path class="arrow" d="M790 251 H842"/>
  <path class="arrow" d="M935 286 V362"/><path class="arrow" d="M850 405 H798"/><path class="arrow" d="M620 405 H568"/><path class="arrow" d="M390 405 H338"/>
</svg>
