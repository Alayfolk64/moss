<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
  <title id="title">Memory and host I/O by optimization stage</title>
  <desc id="desc">The upper panel compares average and peak RSS. The lower panel compares estimated host reads and writes.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #243447; }
    .muted { fill: #607080; }
    .grid { stroke: #d9e1e8; stroke-width: 1; }
    .axis { stroke: #647586; stroke-width: 1.25; }
    .avg-line { fill: none; stroke: #3b82c4; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .peak-line { fill: none; stroke: #d45b58; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .avg-point { fill: #fff; stroke: #3b82c4; stroke-width: 2.5; }
    .peak-point { fill: #fff; stroke: #d45b58; stroke-width: 2.5; }
    .read-bar { fill: #3b82c4; }
    .write-bar { fill: #2f8f83; }
  </style>
  <rect width="760" height="650" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700">Memory and Host I/O by Optimization Stage</text>

  <!-- Panel A: memory usage, plot x=86..716, y=82..278, scale 0..4 GiB. -->
  <text x="86" y="58" font-size="13" font-weight="700">A. Memory Usage</text>
  <line x1="86" y1="278" x2="716" y2="278" class="grid"/><line x1="86" y1="229" x2="716" y2="229" class="grid"/>
  <line x1="86" y1="180" x2="716" y2="180" class="grid"/><line x1="86" y1="131" x2="716" y2="131" class="grid"/>
  <line x1="86" y1="82" x2="716" y2="82" class="grid"/>
  <line x1="86" y1="82" x2="86" y2="278" class="axis"/><line x1="86" y1="278" x2="716" y2="278" class="axis"/>
  <g font-size="10.5" text-anchor="end" class="muted">
    <text x="74" y="282">0</text><text x="74" y="233">1</text><text x="74" y="184">2</text><text x="74" y="135">3</text><text x="74" y="86">4</text>
  </g>
  <text x="26" y="180" text-anchor="middle" font-size="11" class="muted" transform="rotate(-90 26 180)">Resident set size (GiB)</text>

  <!-- KiB values are divided by 1,048,576 to obtain GiB. -->
  <polyline points="126,158.8 216,156.8 306,156.6 396,129.8 486,157.3 576,156.7 666,158.2" class="avg-line"/>
  <polyline points="126,141.5 216,134.5 306,133.6 396,94.4 486,131.2 576,133.8 666,132.0" class="peak-line"/>
  <g>
    <circle cx="126" cy="158.8" r="4.5" class="avg-point"/><circle cx="216" cy="156.8" r="4.5" class="avg-point"/>
    <circle cx="306" cy="156.6" r="4.5" class="avg-point"/><circle cx="396" cy="129.8" r="4.5" class="avg-point"/>
    <circle cx="486" cy="157.3" r="4.5" class="avg-point"/><circle cx="576" cy="156.7" r="4.5" class="avg-point"/>
    <circle cx="666" cy="158.2" r="4.5" class="avg-point"/>
    <circle cx="126" cy="141.5" r="4.5" class="peak-point"/><circle cx="216" cy="134.5" r="4.5" class="peak-point"/>
    <circle cx="306" cy="133.6" r="4.5" class="peak-point"/><circle cx="396" cy="94.4" r="4.5" class="peak-point"/>
    <circle cx="486" cy="131.2" r="4.5" class="peak-point"/><circle cx="576" cy="133.8" r="4.5" class="peak-point"/>
    <circle cx="666" cy="132.0" r="4.5" class="peak-point"/>
  </g>
  <g font-size="9.5" text-anchor="middle">
    <text x="126" y="171" fill="#2f6fa8">2.43</text><text x="216" y="169" fill="#2f6fa8">2.47</text><text x="306" y="169" fill="#2f6fa8">2.48</text>
    <text x="396" y="142" fill="#2f6fa8">3.02</text><text x="486" y="170" fill="#2f6fa8">2.46</text><text x="576" y="169" fill="#2f6fa8">2.48</text><text x="666" y="171" fill="#2f6fa8">2.45</text>
    <text x="126" y="132" fill="#b64b4b">2.79</text><text x="216" y="125" fill="#b64b4b">2.93</text><text x="306" y="124" fill="#b64b4b">2.95</text>
    <text x="396" y="84" fill="#b64b4b">3.75</text><text x="486" y="122" fill="#b64b4b">3.00</text><text x="576" y="125" fill="#b64b4b">2.94</text><text x="666" y="123" fill="#b64b4b">2.98</text>
  </g>
  <g font-size="10.5" text-anchor="middle" class="muted">
    <text x="126" y="296">00-U</text><text x="216" y="296">01</text><text x="306" y="296">02</text><text x="396" y="296">03</text>
    <text x="486" y="296">04</text><text x="576" y="296">05</text><text x="666" y="296">06</text>
  </g>
  <g transform="translate(264 309)" font-size="10.5">
    <line x1="0" y1="7" x2="24" y2="7" class="avg-line"/><circle cx="12" cy="7" r="4" class="avg-point"/><text x="32" y="11">Average RSS</text>
    <line x1="132" y1="7" x2="156" y2="7" class="peak-line"/><circle cx="144" cy="7" r="4" class="peak-point"/><text x="164" y="11">Peak RSS</text>
  </g>

  <!-- Panel B: estimated I/O, plot x=86..716, y=382..578, scale 0..700 MiB. -->
  <text x="86" y="354" font-size="13" font-weight="700">B. Estimated Host I/O</text>
  <line x1="86" y1="578" x2="716" y2="578" class="grid"/><line x1="86" y1="522" x2="716" y2="522" class="grid"/>
  <line x1="86" y1="466" x2="716" y2="466" class="grid"/><line x1="86" y1="410" x2="716" y2="410" class="grid"/>
  <line x1="86" y1="382" x2="716" y2="382" class="grid"/>
  <line x1="86" y1="382" x2="86" y2="578" class="axis"/><line x1="86" y1="578" x2="716" y2="578" class="axis"/>
  <g font-size="10.5" text-anchor="end" class="muted">
    <text x="74" y="582">0</text><text x="74" y="526">200</text><text x="74" y="470">400</text><text x="74" y="414">600</text><text x="74" y="386">700</text>
  </g>
  <text x="26" y="480" text-anchor="middle" font-size="11" class="muted" transform="rotate(-90 26 480)">Estimated I/O (MiB)</text>

  <!-- KiB values are divided by 1,024 to obtain MiB. -->
  <rect x="104" y="449.7" width="20" height="128.3" rx="2" class="read-bar"/><rect x="128" y="471.2" width="20" height="106.8" rx="2" class="write-bar"/>
  <rect x="194" y="435.0" width="20" height="143.0" rx="2" class="read-bar"/><rect x="218" y="478.8" width="20" height="99.2" rx="2" class="write-bar"/>
  <rect x="284" y="455.4" width="20" height="122.6" rx="2" class="read-bar"/><rect x="308" y="475.9" width="20" height="102.1" rx="2" class="write-bar"/>
  <rect x="374" y="403.3" width="20" height="174.7" rx="2" class="read-bar"/><rect x="398" y="431.6" width="20" height="146.4" rx="2" class="write-bar"/>
  <rect x="464" y="434.8" width="20" height="143.2" rx="2" class="read-bar"/><rect x="488" y="442.6" width="20" height="135.4" rx="2" class="write-bar"/>
  <rect x="554" y="467.7" width="20" height="110.3" rx="2" class="read-bar"/><rect x="578" y="506.5" width="20" height="71.5" rx="2" class="write-bar"/>
  <rect x="644" y="468.4" width="20" height="109.6" rx="2" class="read-bar"/><rect x="668" y="510.6" width="20" height="67.4" rx="2" class="write-bar"/>
  <g font-size="9" text-anchor="middle">
    <text x="114" y="443">458</text><text x="138" y="465">381</text><text x="204" y="428">511</text><text x="228" y="472">354</text>
    <text x="294" y="449">438</text><text x="318" y="470">365</text><text x="384" y="397">624</text><text x="408" y="425">523</text>
    <text x="474" y="428">512</text><text x="498" y="436">484</text><text x="564" y="461">394</text><text x="588" y="500">255</text>
    <text x="654" y="462">391</text><text x="678" y="504">241</text>
  </g>
  <g font-size="10.5" text-anchor="middle" class="muted">
    <text x="126" y="596">00-U</text><text x="216" y="596">01</text><text x="306" y="596">02</text><text x="396" y="596">03</text>
    <text x="486" y="596">04</text><text x="576" y="596">05</text><text x="666" y="596">06</text>
  </g>
  <text x="401" y="621" text-anchor="middle" font-size="11" class="muted">Optimization stage</text>
  <g transform="translate(282 628)" font-size="10.5">
    <rect width="12" height="12" rx="2" class="read-bar"/><text x="19" y="10">Read</text>
    <rect x="88" width="12" height="12" rx="2" class="write-bar"/><text x="107" y="10">Write</text>
  </g>
</svg>
