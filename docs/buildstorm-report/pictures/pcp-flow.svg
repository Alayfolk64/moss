<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 920 350" role="img" aria-labelledby="title desc">
  <title id="title">PCP 物理页缓存的分配与释放路径</title>
  <desc id="desc">左侧为当前 CPU 的 PCP 空闲页链表，右侧分别展示分配和释放两条简化路径。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#397fba"/>
    </marker>
    <marker id="green-arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34836a"/>
    </marker>
    <marker id="orange-arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c77d22"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#172b3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    text { font-family: KaiTi, STKaiti, "楷体", serif; fill: #283746; }
    .latin { font-family: "Times New Roman", Times, serif; }
.pcp-head { font-size: 21px; font-weight: 700; fill: #ffffff; }
.pcp-sub { font-size: 17px; fill: #ffffff; }
.lane-title { font-size: 21px; font-weight: 700; }
.node-text { font-size: 19.5px; }
.small { font-size: 17px; }
    .blue { fill: none; stroke: #397fba; stroke-width: 1.7; marker-end: url(#blue-arrow); }
    .green { fill: none; stroke: #34836a; stroke-width: 1.7; marker-end: url(#green-arrow); }
    .orange { fill: none; stroke: #c77d22; stroke-width: 1.5; marker-end: url(#orange-arrow); }
  </style>

  <rect width="920" height="390" fill="#ffffff"/>
  <!-- Left: visual form of one CPU-local PCP. -->
  <g filter="url(#shadow)">
    <rect x="28" y="75" width="226" height="270" rx="7" fill="#f7fafc" stroke="#7ca9ca" stroke-width="1.4"/>
    <rect x="28" y="75" width="226" height="48" rx="7" fill="#397fba"/>
    <text x="141" y="96" text-anchor="middle" class="pcp-head">当前 <tspan class="latin">CPU</tspan> 的 <tspan class="latin">PCP</tspan></text>
    <text x="141" y="115" text-anchor="middle" class="pcp-sub"><tspan class="latin">order-0 / 4 KiB</tspan> 空闲页</text>
  </g>

  <text x="141" y="151" text-anchor="middle" class="small">按用途分开的空闲链表</text>
  <rect x="54" y="169" width="174" height="63" rx="5" fill="#edf5fb" stroke="#78acd2"/>
  <text x="70" y="190" class="small"><tspan class="latin">VirtMem</tspan></text>
  <g transform="translate(125 180)">
    <rect x="0" y="0" width="25" height="20" rx="2" fill="#ffffff" stroke="#397fba"/>
    <line x1="25" y1="10" x2="37" y2="10" stroke="#397fba"/>
    <rect x="37" y="0" width="25" height="20" rx="2" fill="#ffffff" stroke="#397fba"/>
    <line x1="62" y1="10" x2="74" y2="10" stroke="#397fba"/>
    <rect x="74" y="0" width="25" height="20" rx="2" fill="#ffffff" stroke="#397fba"/>
  </g>
  <text x="70" y="219" class="small"><tspan class="latin">PageCache</tspan></text>
  <g transform="translate(125 209)">
    <rect x="0" y="0" width="25" height="20" rx="2" fill="#ffffff" stroke="#397fba"/>
    <line x1="25" y1="10" x2="37" y2="10" stroke="#397fba"/>
    <rect x="37" y="0" width="25" height="20" rx="2" fill="#ffffff" stroke="#397fba"/>
    <line x1="62" y1="10" x2="74" y2="10" stroke="#397fba"/>
    <rect x="74" y="0" width="25" height="20" rx="2" fill="#ffffff" stroke="#397fba"/>
  </g>

  <rect x="54" y="250" width="174" height="53" rx="5" fill="#ffffff" stroke="#b7c4ce"/>
  <text x="141" y="272" text-anchor="middle" class="small"><tspan class="latin">count</tspan>：当前空闲页数</text>
  <text x="141" y="291" text-anchor="middle" class="small"><tspan class="latin">high</tspan>：缓存高水位</text>

  <!-- Split from PCP into two horizontal lanes. -->
  <path d="M254 205 H282 V137 H311" class="blue"/>
  <path d="M254 250 H282 V302 H311" class="green"/>

  <!-- Allocation lane. -->
  <text x="318" y="88" class="lane-title" fill="#2e6f9f">分配路径</text>
  <line x1="318" y1="97" x2="890" y2="97" stroke="#c9ddeb" stroke-width="1"/>

  <g filter="url(#shadow)">
    <rect x="315" y="113" width="124" height="48" rx="5" fill="#edf6fc" stroke="#397fba"/>
    <text x="377" y="142" text-anchor="middle" class="node-text">从 <tspan class="latin">PCP</tspan> 取页</text>
  </g>
  <line x1="439" y1="137" x2="479" y2="137" class="blue"/>

  <polygon points="544,105 610,137 544,169 478,137" fill="#ffffff" stroke="#397fba" stroke-width="1.4"/>
  <text x="544" y="142" text-anchor="middle" class="node-text">命中？</text>

  <line x1="610" y1="137" x2="667" y2="137" class="blue"/>
  <text x="633" y="126" class="small" fill="#2e6f9f">是</text>
  <g filter="url(#shadow)">
    <rect x="671" y="113" width="111" height="48" rx="5" fill="#e8f4fb" stroke="#397fba"/>
    <text x="726.5" y="142" text-anchor="middle" class="node-text">返回物理页</text>
  </g>

  <path d="M544 169 V191 H666" class="orange"/>
  <text x="555" y="184" class="small" fill="#986017">否</text>
  <g filter="url(#shadow)">
    <rect x="671" y="172" width="141" height="38" rx="5" fill="#fff8ed" stroke="#c77d22"/>
    <text x="741.5" y="196" text-anchor="middle" class="node-text">批量补充 <tspan class="latin">PCP</tspan></text>
  </g>
  <line x1="812" y1="191" x2="858" y2="191" class="orange"/>
  <rect x="850" y="172" width="46" height="38" rx="4" fill="#e8f4fb" stroke="#397fba"/>
  <text x="873" y="188" text-anchor="middle" class="small">返回</text>
  <text x="873" y="203" text-anchor="middle" class="small">物理页</text>

  <!-- Release lane. -->
  <text x="318" y="253" class="lane-title" fill="#2f735e">释放路径</text>
  <line x1="318" y1="262" x2="890" y2="262" stroke="#c9dfd7" stroke-width="1"/>

  <g filter="url(#shadow)">
    <rect x="315" y="278" width="124" height="48" rx="5" fill="#edf8f4" stroke="#34836a"/>
    <text x="377" y="307" text-anchor="middle" class="node-text">释放物理页</text>
  </g>
  <line x1="439" y1="302" x2="478" y2="302" class="green"/>

  <g filter="url(#shadow)">
    <rect x="483" y="278" width="124" height="48" rx="5" fill="#edf8f4" stroke="#34836a"/>
    <text x="545" y="307" text-anchor="middle" class="node-text">放回 <tspan class="latin">PCP</tspan></text>
  </g>
  <line x1="607" y1="302" x2="643" y2="302" class="green"/>

  <polygon points="707,270 771,302 707,334 643,302" fill="#ffffff" stroke="#34836a" stroke-width="1.4"/>
  <text x="707" y="298" text-anchor="middle" class="small">达到</text>
  <text x="707" y="315" text-anchor="middle" class="small"><tspan class="latin">high</tspan>？</text>

  <line x1="771" y1="302" x2="817" y2="302" class="orange"/>
  <text x="789" y="291" class="small" fill="#986017">是</text>
  <g filter="url(#shadow)">
    <rect x="821" y="278" width="75" height="48" rx="5" fill="#fff8ed" stroke="#c77d22"/>
    <text x="858.5" y="298" text-anchor="middle" class="small">批量归还</text>
    <text x="858.5" y="315" text-anchor="middle" class="small">全局</text>
  </g>

  <path d="M707 334 V356 H812" class="green"/>
  <text x="718" y="350" class="small" fill="#2f735e">否</text>
  <g filter="url(#shadow)">
    <rect x="817" y="337" width="79" height="38" rx="5" fill="#edf8f4" stroke="#34836a"/>
    <text x="856.5" y="361" text-anchor="middle" class="small">留在本地</text>
  </g>

</svg>
