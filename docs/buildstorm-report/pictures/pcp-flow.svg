<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="KaiTi,STKaiti,楷体,Times New Roman,serif">
  <defs>
    <marker id="g" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#27ae60"/>
    </marker>
    <marker id="r" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#e74c3c"/>
    </marker>
    <marker id="o" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#e67e22"/>
    </marker>
  </defs>

  <rect width="700" height="480" fill="#fcfcfc" rx="4"/>

  <!-- ===== LEFT: Global Allocator ===== -->
  <rect x="28" y="60" width="180" height="360" rx="8" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2"/>
  <rect x="28" y="60" width="180" height="32" rx="8" fill="#e74c3c"/>
  <rect x="28" y="84" width="180" height="8" fill="#e74c3c"/>
  <text x="118" y="81" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">全局物理页分配器</text>

  <!-- Lock icon -->
  <text x="118" y="125" text-anchor="middle" font-size="22">🔒</text>
  <text x="118" y="148" text-anchor="middle" fill="#c0392b" font-size="11">全局自旋锁保护</text>

  <!-- Batch interface -->
  <rect x="48" y="170" width="140" height="40" rx="5" fill="#fff" stroke="#e74c3c" stroke-width="1"/>
  <text x="118" y="188" text-anchor="middle" fill="#922b21" font-size="11">批量分配接口</text>
  <text x="118" y="204" text-anchor="middle" fill="#922b21" font-size="10">allocate_page_list</text>

  <rect x="48" y="225" width="140" height="40" rx="5" fill="#fff" stroke="#e74c3c" stroke-width="1"/>
  <text x="118" y="243" text-anchor="middle" fill="#922b21" font-size="11">批量回收接口</text>
  <text x="118" y="259" text-anchor="middle" fill="#922b21" font-size="10">deallocate_page_lists</text>

  <!-- Bitmap hint -->
  <rect x="48" y="280" width="140" height="36" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="118" y="298" text-anchor="middle" fill="#777" font-size="10">伙伴分配器</text>
  <text x="118" y="312" text-anchor="middle" fill="#777" font-size="10">(Buddy Allocator)</text>

  <!-- drain fallback -->
  <rect x="48" y="345" width="140" height="36" rx="5" fill="#fef9e7" stroke="#f39c12" stroke-width="1"/>
  <text x="118" y="363" text-anchor="middle" fill="#7d6608" font-size="10">全局分配失败时</text>
  <text x="118" y="377" text-anchor="middle" fill="#7d6608" font-size="10">drain 全部 PCP 重试</text>

  <!-- ===== RIGHT: PCP Caches ===== -->
  <!-- CPU 0 -->
  <rect x="270" y="60" width="180" height="155" rx="6" fill="#eef6fc" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="270" y="60" width="180" height="26" rx="6" fill="#2980b9"/>
  <rect x="270" y="78" width="180" height="8" fill="#2980b9"/>
  <text x="360" y="78" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="bold">CPU 0 — PCP 页缓存</text>

  <text x="360" y="108" text-anchor="middle" fill="#1a5276" font-size="10.5">🔗 VirtMem → 🔗 PageCache → ...</text>
  <rect x="288" y="118" width="144" height="20" rx="3" fill="#d6eaf8" stroke="#2980b9" stroke-width="0.5"/>
  <text x="360" y="132" text-anchor="middle" fill="#1a5276" font-size="9.5">按 UsageKind 分链，共 64 slot</text>

  <rect x="288" y="146" width="144" height="20" rx="3" fill="#d5f5e3" stroke="#27ae60" stroke-width="0.5"/>
  <text x="360" y="160" text-anchor="middle" fill="#1e8449" font-size="9.5">hit → 直接弹出，仅持 IRQ 锁</text>

  <rect x="288" y="172" width="144" height="20" rx="3" fill="#fdebd0" stroke="#f39c12" stroke-width="0.5"/>
  <text x="360" y="186" text-anchor="middle" fill="#7d6608" font-size="9.5">miss → refill 批量取 batch 页</text>

  <rect x="288" y="198" width="144" height="20" rx="3" fill="#fdebd0" stroke="#e67e22" stroke-width="0.5"/>
  <text x="360" y="212" text-anchor="middle" fill="#a04000" font-size="9.5">超 high 水位 → drain 批量退</text>

  <!-- CPU 1 -->
  <rect x="490" y="60" width="180" height="155" rx="6" fill="#eef6fc" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="490" y="60" width="180" height="26" rx="6" fill="#2980b9"/>
  <rect x="490" y="78" width="180" height="8" fill="#2980b9"/>
  <text x="580" y="78" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="bold">CPU 1 — PCP 页缓存</text>

  <text x="580" y="108" text-anchor="middle" fill="#1a5276" font-size="10.5">🔗 VirtMem → 🔗 PageCache → ...</text>
  <rect x="508" y="118" width="144" height="20" rx="3" fill="#d6eaf8" stroke="#2980b9" stroke-width="0.5"/>
  <text x="580" y="132" text-anchor="middle" fill="#1a5276" font-size="9.5">按 UsageKind 分链，共 64 slot</text>

  <rect x="508" y="146" width="144" height="20" rx="3" fill="#d5f5e3" stroke="#27ae60" stroke-width="0.5"/>
  <text x="580" y="160" text-anchor="middle" fill="#1e8449" font-size="9.5">hit → 直接弹出，仅持 IRQ 锁</text>

  <rect x="508" y="172" width="144" height="20" rx="3" fill="#fdebd0" stroke="#f39c12" stroke-width="0.5"/>
  <text x="580" y="186" text-anchor="middle" fill="#7d6608" font-size="9.5">miss → refill 批量取 batch 页</text>

  <rect x="508" y="198" width="144" height="20" rx="3" fill="#fdebd0" stroke="#e67e22" stroke-width="0.5"/>
  <text x="580" y="212" text-anchor="middle" fill="#a04000" font-size="9.5">超 high 水位 → drain 批量退</text>

  <!-- ... more CPUs -->
  <text x="610" y="242" text-anchor="middle" fill="#95a5a6" font-size="11">...</text>
  <rect x="578" y="250" width="64" height="20" rx="3" fill="#eef6fc" stroke="#2980b9" stroke-width="0.8"/>
  <text x="610" y="264" text-anchor="middle" fill="#1a5276" font-size="9">CPU 7</text>

  <!-- ===== ARROWS ===== -->
  <!-- Top panel: ALLOC PATH -->
  <rect x="270" y="285" width="400" height="90" rx="6" fill="#f5faf5" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="470" y="305" text-anchor="middle" fill="#1e8449" font-size="12" font-weight="bold">分配路径：缺页 / 页缓存 / COW 需要新物理页</text>

  <!-- Alloc hit path -->
  <text x="332" y="338" text-anchor="middle" fill="#1e8449" font-size="10.5">① 从本 CPU PCP pop</text>
  <line x1="400" y1="334" x2="520" y2="334" stroke="#27ae60" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="460" y="330" text-anchor="middle" fill="#27ae60" font-size="9.5">命中</text>
  <text x="560" y="338" text-anchor="middle" fill="#1e8449" font-size="10.5">直接返回物理页</text>

  <!-- Alloc miss path -->
  <text x="300" y="366" text-anchor="middle" fill="#e74c3c" font-size="10.5">② miss</text>
  <line x1="340" y1="362" x2="205" y2="362" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#r)"/>
  <text x="270" y="357" text-anchor="middle" fill="#e74c3c" font-size="9">批量 refill (batch 页)</text>

  <!-- Bottom panel: FREE PATH -->
  <rect x="270" y="390" width="400" height="82" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="470" y="410" text-anchor="middle" fill="#a04000" font-size="12" font-weight="bold">释放路径：进程退出 / munmap / 回收释放物理页</text>

  <!-- Free push path -->
  <text x="320" y="440" text-anchor="middle" fill="#a04000" font-size="10.5">① push 回本 CPU PCP</text>
  <line x1="388" y1="436" x2="290" y2="436" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Free drain path -->
  <text x="560" y="440" text-anchor="middle" fill="#e67e22" font-size="10.5">② 超 high 水位</text>
  <line x1="520" y1="455" x2="212" y2="455" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#o)"/>
  <text x="370" y="468" text-anchor="middle" fill="#e67e22" font-size="9.5">批量 drain 退回全局 (释放 batch 页)</text>

  <!-- ===== KEY METRICS ===== -->
  <rect x="30" y="440" width="220" height="55" rx="5" fill="#f8f9fa" stroke="#ddd" stroke-width="0.8"/>
  <text x="140" y="458" text-anchor="middle" fill="#555" font-size="10" font-weight="bold">8 GiB / 8 CPU 下的控制参数</text>
  <text x="60" y="476" fill="#555" font-size="9.5">batch = 63</text>
  <text x="155" y="476" fill="#555" font-size="9.5">high = 624 ~ 32768</text>
  <text x="60" y="491" fill="#555" font-size="9.5">min = 624</text>
  <text x="155" y="491" fill="#555" font-size="9.5">max = 32768</text>
</svg>
