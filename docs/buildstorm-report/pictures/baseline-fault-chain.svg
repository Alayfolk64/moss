<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 950" font-family="KaiTi,STKaiti,楷体,Times New Roman,serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#aaa"/>
    </marker>
  </defs>

  <rect width="720" height="950" fill="#fff" rx="2"/>

  <!-- ============================================================ -->
  <!-- LEFT LOCK BARS                                               -->
  <!-- ============================================================ -->

  <!-- AddrSpace: node 2 (y=64) → node 20 (y=856), red -->
  <rect x="44" y="69" width="5" height="792" rx="2" fill="#e74c3c"/>
  <text x="30" y="470" text-anchor="middle" fill="#d63031" font-size="12" transform="rotate(-90,30,470)">AddrSpace 独占锁</text>

  <!-- page_cache+cache_op: node 7 (y=284) → node 19 (y=812), blue -->
  <rect x="64" y="289" width="5" height="528" rx="2" fill="#2980b9"/>
  <text x="50" y="558" text-anchor="middle" fill="#2471a3" font-size="12" transform="rotate(-90,50,558)">cache_op + page_cache 锁</text>

  <!-- ============================================================ -->
  <!-- RIGHT LOCK BARS                                              -->
  <!-- ============================================================ -->

  <!-- ext4: node 11 (y=460) → node 14 (y=592), purple -->
  <rect x="624" y="465" width="5" height="132" rx="2" fill="#8e44ad"/>
  <text x="652" y="536" text-anchor="middle" fill="#7d3c98" font-size="12" transform="rotate(-90,652,536)">ext4 全局自旋锁</text>

  <!-- global_allocator #1: node 5 (y=196-226), orange -->
  <rect x="644" y="201" width="5" height="30" rx="2" fill="#f39c12"/>
  <!-- global_allocator #2: node 9 (y=372-402), orange -->
  <rect x="644" y="377" width="5" height="30" rx="2" fill="#f39c12"/>
  <text x="672" y="310" text-anchor="middle" fill="#e67e22" font-size="12" transform="rotate(-90,672,310)">全局页分配器锁</text>

  <!-- ============================================================ -->
  <!-- NODES  (x=120, w=480, h=30, gap=14, step=44)                -->
  <!-- ============================================================ -->

  <!-- 1: trigger -->
  <rect x="120" y="20" width="480" height="30" rx="5" fill="#f5f5f5" stroke="#d5d5d5" stroke-width="0.8"/>
  <text x="360" y="40" text-anchor="middle" fill="#333" font-size="13.5">用户程序访问未映射的虚拟地址，触发 Page Fault</text>
  <line x1="360" y1="50" x2="360" y2="62" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 2: lock AddrSpace -->
  <rect x="120" y="64" width="480" height="30" rx="5" fill="#fff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="360" y="84" text-anchor="middle" fill="#c0392b" font-size="13.5">进入内核态，获取当前进程的 AddrSpace 独占锁</text>
  <line x1="360" y1="94" x2="360" y2="106" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 3: find VMA -->
  <rect x="120" y="108" width="480" height="30" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="360" y="128" text-anchor="middle" fill="#444" font-size="13.5">检查地址合法性，在 VMA 树中查找对应 VMA 并校验访问权限</text>
  <line x1="360" y1="138" x2="360" y2="150" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 4: query PTE -->
  <rect x="120" y="152" width="480" height="30" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="360" y="172" text-anchor="middle" fill="#444" font-size="13.5">按需分页：查询 PTE，发现目标 PTE 不存在</text>
  <line x1="360" y1="182" x2="360" y2="194" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 5: alloc private frame -->
  <rect x="120" y="196" width="480" height="30" rx="5" fill="#fef9e7" stroke="#f39c12" stroke-width="1.4"/>
  <text x="360" y="216" text-anchor="middle" fill="#7d6608" font-size="13.5">进入全局页分配器，分配一个新的 4 KiB 私有物理页</text>
  <line x1="360" y1="226" x2="360" y2="238" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 6: enter page cache layer -->
  <rect x="120" y="240" width="480" height="30" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="360" y="260" text-anchor="middle" fill="#444" font-size="13.5">准备从文件读取数据填充私有页，进入文件页缓存层</text>
  <line x1="360" y1="270" x2="360" y2="282" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 7: lock cache_op + page_cache -->
  <rect x="120" y="284" width="480" height="30" rx="5" fill="#fff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="360" y="304" text-anchor="middle" fill="#1a5276" font-size="13.5">获取 cache_op 文件页缓存大锁，获取 page_cache 互斥锁</text>
  <line x1="360" y1="314" x2="360" y2="326" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 8: cache lookup -->
  <rect x="120" y="328" width="480" height="30" rx="5" fill="#f5faf5" stroke="#27ae60" stroke-width="1"/>
  <text x="360" y="348" text-anchor="middle" fill="#1e8449" font-size="13.5">查询页缓存：命中则直接复制返回；未命中则继续以下步骤（冷缓存主路径）</text>
  <line x1="360" y1="358" x2="360" y2="370" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 9: alloc PageCache frame -->
  <rect x="120" y="372" width="480" height="30" rx="5" fill="#fef9e7" stroke="#f39c12" stroke-width="1.4"/>
  <text x="360" y="392" text-anchor="middle" fill="#7d6608" font-size="13.5">再次进入全局页分配器，分配一个新物理页作为 PageCache</text>
  <line x1="360" y1="402" x2="360" y2="414" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 10: enter ext4 with page cache lock held -->
  <rect x="120" y="416" width="480" height="30" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="360" y="436" text-anchor="middle" fill="#444" font-size="13.5">持有页缓存锁进入 ext4 文件系统，准备读取磁盘数据</text>
  <line x1="360" y1="446" x2="360" y2="458" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 11: lock ext4, query mapping -->
  <rect x="120" y="460" width="480" height="30" rx="5" fill="#fff" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="360" y="480" text-anchor="middle" fill="#6c3483" font-size="13.5">获取 ext4 全局自旋锁，查询 inode 与 extent block mapping</text>
  <line x1="360" y1="490" x2="360" y2="502" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 12: submit IO, wait disk (key bottleneck) -->
  <rect x="120" y="504" width="480" height="30" rx="5" fill="#fdf2f2" stroke="#e74c3c" stroke-width="1.8" stroke-dasharray="7,4"/>
  <text x="360" y="524" text-anchor="middle" fill="#c0392b" font-size="13.5" font-weight="bold">提交 VirtIO 块设备请求，同步等待磁盘 I/O 完成</text>
  <line x1="360" y1="534" x2="360" y2="546" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 13: data read into PageCache (still in ext4 lock) -->
  <rect x="120" y="548" width="480" height="30" rx="5" fill="#f8f4fa" stroke="#8e44ad" stroke-width="0.8"/>
  <text x="360" y="568" text-anchor="middle" fill="#6c3483" font-size="13.5">磁盘数据从块设备读入 PageCache 物理页（仍在 ext4 锁内）</text>
  <line x1="360" y1="578" x2="360" y2="590" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 14: unlock ext4, insert LRU -->
  <rect x="120" y="592" width="480" height="30" rx="5" fill="#eaf2f8" stroke="#7f8c8d" stroke-width="1.2"/>
  <text x="360" y="612" text-anchor="middle" fill="#555" font-size="13.5">释放 ext4 全局自旋锁，将 PageCache 页插入 LRU</text>
  <line x1="360" y1="622" x2="360" y2="634" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 15: memcpy -->
  <rect x="120" y="636" width="480" height="30" rx="5" fill="#fef5e7" stroke="#e67e22" stroke-width="1.4"/>
  <text x="360" y="656" text-anchor="middle" fill="#a04000" font-size="13.5">将 PageCache 页中的文件数据复制到进程私有物理页 (memcpy 4 KiB)</text>
  <line x1="360" y1="666" x2="360" y2="678" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 16: install PTE -->
  <rect x="120" y="680" width="480" height="30" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="360" y="700" text-anchor="middle" fill="#444" font-size="13.5">CAS 原子操作安装 PTE，登记 frame 引用计数</text>
  <line x1="360" y1="710" x2="360" y2="722" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 17: flush TLB -->
  <rect x="120" y="724" width="480" height="30" rx="5" fill="#fff" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="360" y="744" text-anchor="middle" fill="#444" font-size="13.5">刷新本地 TLB 对应项，使旧映射失效</text>
  <line x1="360" y1="754" x2="360" y2="766" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 18: unlock page_cache -->
  <rect x="120" y="768" width="480" height="30" rx="5" fill="#eaf2f8" stroke="#7f8c8d" stroke-width="1.2"/>
  <text x="360" y="788" text-anchor="middle" fill="#555" font-size="13.5">释放 page_cache 互斥锁</text>
  <line x1="360" y1="798" x2="360" y2="810" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 19: unlock cache_op -->
  <rect x="120" y="812" width="480" height="30" rx="5" fill="#eaf2f8" stroke="#7f8c8d" stroke-width="1.2"/>
  <text x="360" y="832" text-anchor="middle" fill="#555" font-size="13.5">释放 cache_op 文件页缓存大锁</text>
  <line x1="360" y1="842" x2="360" y2="854" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 20: unlock AddrSpace -->
  <rect x="120" y="856" width="480" height="30" rx="5" fill="#eaf2f8" stroke="#7f8c8d" stroke-width="1.2"/>
  <text x="360" y="876" text-anchor="middle" fill="#555" font-size="13.5">释放 AddrSpace 独占锁</text>
  <line x1="360" y1="886" x2="360" y2="898" stroke="#aaa" stroke-width="1.1" marker-end="url(#a)"/>

  <!-- 21: return -->
  <rect x="120" y="900" width="480" height="30" rx="5" fill="#f5f5f5" stroke="#d5d5d5" stroke-width="0.8"/>
  <text x="360" y="920" text-anchor="middle" fill="#333" font-size="13.5">返回用户态，重新执行故障指令</text>
</svg>
