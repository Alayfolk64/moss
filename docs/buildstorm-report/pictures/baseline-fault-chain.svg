<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc">
  <title id="title">优化前文件缺页处理链路与锁覆盖周期</title>
  <desc id="desc">中间为文件缺页处理流程，左右轨道表示 AddrSpace、页缓存、ext4 和全局页分配器的持锁周期。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b98a5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#172b3a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text { font-family: KaiTi, STKaiti, "楷体", serif; fill: #283746; }
    .latin { font-family: "Times New Roman", Times, serif; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #6b7885; }
    .node-text { font-size: 14px; }
    .rail-label { font-size: 13px; font-weight: 700; }
    .rail-note { font-size: 11.5px; }
    .flow { stroke: #8b98a5; stroke-width: 1.25; marker-end: url(#arrow); }
    .node { fill: #ffffff; stroke: #cfd8df; stroke-width: 1; }
    .release { fill: #f5f8fa; stroke: #aebbc5; stroke-width: 1; }
  </style>

  <rect width="900" height="1080" fill="#ffffff"/>
  <text x="450" y="31" text-anchor="middle" class="title">优化前文件缺页处理链路与锁覆盖周期</text>
  <text x="450" y="52" text-anchor="middle" class="subtitle">彩色轨道表示从获取锁到释放锁的完整覆盖范围</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#536372">缺页处理流程</text>
  <text x="92" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#536372">外层锁</text>
  <text x="808" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#536372">内层锁</text>

  <!-- Lock rails are separated from the flow so that ranges remain readable. -->
  <rect x="22" y="91" width="160" height="936" rx="6" fill="#f8fafb" stroke="#e1e7ec"/>
  <rect x="718" y="91" width="160" height="936" rx="6" fill="#f8fafb" stroke="#e1e7ec"/>

  <!-- AddrSpace: acquire at step 2, release at step 20. -->
  <line x1="55" y1="138" x2="55" y2="948" stroke="#d55a56" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <circle cx="55" cy="138" r="7" fill="#ffffff" stroke="#d55a56" stroke-width="3"/>
  <circle cx="55" cy="948" r="7" fill="#d55a56"/>
  <line x1="55" y1="138" x2="190" y2="138" stroke="#d55a56" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="55" y1="948" x2="190" y2="948" stroke="#d55a56" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g filter="url(#shadow)">
    <rect x="68" y="495" width="84" height="57" rx="5" fill="#fff" stroke="#d55a56"/>
    <text x="110" y="517" text-anchor="middle" class="rail-label" fill="#b74743"><tspan class="latin">AddrSpace</tspan></text>
    <text x="110" y="537" text-anchor="middle" class="rail-label" fill="#b74743">独占锁</text>
  </g>
  <text x="43" y="128" text-anchor="end" class="rail-note" fill="#b74743">获取</text>
  <text x="43" y="967" text-anchor="end" class="rail-note" fill="#b74743">释放</text>

  <!-- cache_op + page_cache: acquire at step 7, release by step 19. -->
  <line x1="166" y1="363" x2="166" y2="903" stroke="#347fba" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <circle cx="166" cy="363" r="7" fill="#ffffff" stroke="#347fba" stroke-width="3"/>
  <circle cx="166" cy="903" r="7" fill="#347fba"/>
  <line x1="166" y1="363" x2="190" y2="363" stroke="#347fba" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="166" y1="903" x2="190" y2="903" stroke="#347fba" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g filter="url(#shadow)">
    <rect x="68" y="602" width="84" height="64" rx="5" fill="#fff" stroke="#347fba"/>
    <text x="110" y="623" text-anchor="middle" font-size="11.5" font-weight="700" fill="#286997"><tspan class="latin">cache_op</tspan></text>
    <text x="110" y="641" text-anchor="middle" font-size="11.5" font-weight="700" fill="#286997"><tspan class="latin">+ page_cache</tspan></text>
    <text x="110" y="658" text-anchor="middle" class="rail-label" fill="#286997">锁</text>
  </g>
  <text x="154" y="350" text-anchor="end" class="rail-note" fill="#286997">获取</text>
  <text x="154" y="921" text-anchor="end" class="rail-note" fill="#286997">全部释放</text>

  <!-- ext4: acquire at step 11, release at step 14. -->
  <line x1="739" y1="543" x2="739" y2="678" stroke="#8b5aa9" stroke-width="7" stroke-linecap="round" opacity="0.92"/>
  <circle cx="739" cy="543" r="7" fill="#ffffff" stroke="#8b5aa9" stroke-width="3"/>
  <circle cx="739" cy="678" r="7" fill="#8b5aa9"/>
  <line x1="710" y1="543" x2="739" y2="543" stroke="#8b5aa9" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="710" y1="678" x2="739" y2="678" stroke="#8b5aa9" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g filter="url(#shadow)">
    <rect x="758" y="580" width="101" height="60" rx="5" fill="#fff" stroke="#8b5aa9"/>
    <text x="808.5" y="603" text-anchor="middle" class="rail-label" fill="#74458e"><tspan class="latin">ext4</tspan></text>
    <text x="808.5" y="624" text-anchor="middle" class="rail-label" fill="#74458e">全局自旋锁</text>
  </g>
  <text x="753" y="531" class="rail-note" fill="#74458e">获取</text>
  <text x="753" y="697" class="rail-note" fill="#74458e">释放</text>

  <!-- Global page allocator: two independent short acquisitions at steps 5 and 9. -->
  <line x1="851" y1="273" x2="851" y2="498" stroke="#d99428" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="851" y1="273" x2="851" y2="293" stroke="#d99428" stroke-width="9" stroke-linecap="round"/>
  <line x1="851" y1="453" x2="851" y2="473" stroke="#d99428" stroke-width="9" stroke-linecap="round"/>
  <line x1="710" y1="283" x2="851" y2="283" stroke="#d99428" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="710" y1="463" x2="851" y2="463" stroke="#d99428" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g filter="url(#shadow)">
    <rect x="729" y="341" width="108" height="66" rx="5" fill="#fff" stroke="#d99428"/>
    <text x="783" y="363" text-anchor="middle" class="rail-label" fill="#a96f19">全局页</text>
    <text x="783" y="382" text-anchor="middle" class="rail-label" fill="#a96f19">分配器锁</text>
    <text x="783" y="399" text-anchor="middle" class="rail-note" fill="#a96f19">两次短暂持有</text>
  </g>

  <!-- Main flow. Nodes: x=190, width=520, height=34, vertical step=45. -->
  <g filter="url(#shadow)">
    <rect x="190" y="91" width="520" height="34" rx="5" fill="#f4f6f8" stroke="#cfd8df"/>
    <text x="450" y="113" text-anchor="middle" class="node-text">用户程序访问未映射的虚拟地址，触发 <tspan class="latin">Page Fault</tspan></text>
  </g>
  <line x1="450" y1="125" x2="450" y2="134" class="flow"/>

  <rect x="190" y="136" width="520" height="34" rx="5" fill="#fff7f6" stroke="#d55a56" stroke-width="1.5"/>
  <text x="450" y="158" text-anchor="middle" class="node-text" fill="#a94340">进入内核态，获取当前进程的 <tspan class="latin">AddrSpace</tspan> 独占锁</text>
  <line x1="450" y1="170" x2="450" y2="179" class="flow"/>

  <rect x="190" y="181" width="520" height="34" rx="5" class="node"/>
  <text x="450" y="203" text-anchor="middle" class="node-text">检查地址合法性，在 <tspan class="latin">VMA</tspan> 树中查找对应 <tspan class="latin">VMA</tspan> 并校验访问权限</text>
  <line x1="450" y1="215" x2="450" y2="224" class="flow"/>

  <rect x="190" y="226" width="520" height="34" rx="5" class="node"/>
  <text x="450" y="248" text-anchor="middle" class="node-text">按需分页：查询 <tspan class="latin">PTE</tspan>，发现目标 <tspan class="latin">PTE</tspan> 不存在</text>
  <line x1="450" y1="260" x2="450" y2="269" class="flow"/>

  <rect x="190" y="271" width="520" height="34" rx="5" fill="#fff9ee" stroke="#d99428" stroke-width="1.4"/>
  <text x="450" y="293" text-anchor="middle" class="node-text" fill="#8c5e17">进入全局页分配器，分配一个新的 <tspan class="latin">4 KiB</tspan> 私有物理页</text>
  <line x1="450" y1="305" x2="450" y2="314" class="flow"/>

  <rect x="190" y="316" width="520" height="34" rx="5" class="node"/>
  <text x="450" y="338" text-anchor="middle" class="node-text">准备从文件读取数据填充私有页，进入文件页缓存层</text>
  <line x1="450" y1="350" x2="450" y2="359" class="flow"/>

  <rect x="190" y="361" width="520" height="34" rx="5" fill="#f5faff" stroke="#347fba" stroke-width="1.5"/>
  <text x="450" y="383" text-anchor="middle" class="node-text" fill="#286997">获取 <tspan class="latin">cache_op</tspan> 文件页缓存大锁与 <tspan class="latin">page_cache</tspan> 互斥锁</text>
  <line x1="450" y1="395" x2="450" y2="404" class="flow"/>

  <rect x="190" y="406" width="520" height="34" rx="5" fill="#f5faf7" stroke="#5b9a76"/>
  <text x="450" y="428" text-anchor="middle" class="node-text" fill="#397052">查询页缓存：命中则复制返回；未命中则进入冷缓存主路径</text>
  <line x1="450" y1="440" x2="450" y2="449" class="flow"/>

  <rect x="190" y="451" width="520" height="34" rx="5" fill="#fff9ee" stroke="#d99428" stroke-width="1.4"/>
  <text x="450" y="473" text-anchor="middle" class="node-text" fill="#8c5e17">再次进入全局页分配器，分配新物理页作为 <tspan class="latin">PageCache</tspan></text>
  <line x1="450" y1="485" x2="450" y2="494" class="flow"/>

  <rect x="190" y="496" width="520" height="34" rx="5" class="node"/>
  <text x="450" y="518" text-anchor="middle" class="node-text">持有页缓存锁进入 <tspan class="latin">ext4</tspan> 文件系统，准备读取磁盘数据</text>
  <line x1="450" y1="530" x2="450" y2="539" class="flow"/>

  <rect x="190" y="541" width="520" height="34" rx="5" fill="#faf6fc" stroke="#8b5aa9" stroke-width="1.5"/>
  <text x="450" y="563" text-anchor="middle" class="node-text" fill="#74458e">获取 <tspan class="latin">ext4</tspan> 全局自旋锁，查询 <tspan class="latin">inode</tspan> 的 <tspan class="latin">extent block mapping</tspan></text>
  <line x1="450" y1="575" x2="450" y2="584" class="flow"/>

  <rect x="190" y="586" width="520" height="34" rx="5" fill="#fff2f1" stroke="#d55a56" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="450" y="608" text-anchor="middle" class="node-text" font-weight="700" fill="#a94340">提交 <tspan class="latin">VirtIO</tspan> 块设备请求，同步等待磁盘 <tspan class="latin">I/O</tspan> 完成</text>
  <line x1="450" y1="620" x2="450" y2="629" class="flow"/>

  <rect x="190" y="631" width="520" height="34" rx="5" fill="#faf6fc" stroke="#b79ac8"/>
  <text x="450" y="653" text-anchor="middle" class="node-text" fill="#74458e">磁盘数据从块设备读入 <tspan class="latin">PageCache</tspan> 物理页（仍在 <tspan class="latin">ext4</tspan> 锁内）</text>
  <line x1="450" y1="665" x2="450" y2="674" class="flow"/>

  <rect x="190" y="676" width="520" height="34" rx="5" class="release"/>
  <text x="450" y="698" text-anchor="middle" class="node-text">释放 <tspan class="latin">ext4</tspan> 全局自旋锁，将 <tspan class="latin">PageCache</tspan> 页插入 <tspan class="latin">LRU</tspan></text>
  <line x1="450" y1="710" x2="450" y2="719" class="flow"/>

  <rect x="190" y="721" width="520" height="34" rx="5" fill="#fff8ef" stroke="#cf8a36" stroke-width="1.3"/>
  <text x="450" y="743" text-anchor="middle" class="node-text" fill="#955c18">将文件数据从 <tspan class="latin">PageCache</tspan> 页复制到进程私有页（<tspan class="latin">memcpy 4 KiB</tspan>）</text>
  <line x1="450" y1="755" x2="450" y2="764" class="flow"/>

  <rect x="190" y="766" width="520" height="34" rx="5" class="node"/>
  <text x="450" y="788" text-anchor="middle" class="node-text"><tspan class="latin">CAS</tspan> 原子操作安装 <tspan class="latin">PTE</tspan>，登记 <tspan class="latin">frame</tspan> 引用计数</text>
  <line x1="450" y1="800" x2="450" y2="809" class="flow"/>

  <rect x="190" y="811" width="520" height="34" rx="5" class="node"/>
  <text x="450" y="833" text-anchor="middle" class="node-text">刷新本地 <tspan class="latin">TLB</tspan> 对应项，使旧映射失效</text>
  <line x1="450" y1="845" x2="450" y2="854" class="flow"/>

  <rect x="190" y="856" width="520" height="34" rx="5" class="release"/>
  <text x="450" y="878" text-anchor="middle" class="node-text">释放 <tspan class="latin">page_cache</tspan> 互斥锁</text>
  <line x1="450" y1="890" x2="450" y2="899" class="flow"/>

  <rect x="190" y="901" width="520" height="34" rx="5" class="release"/>
  <text x="450" y="923" text-anchor="middle" class="node-text">释放 <tspan class="latin">cache_op</tspan> 文件页缓存大锁</text>
  <line x1="450" y1="935" x2="450" y2="944" class="flow"/>

  <rect x="190" y="946" width="520" height="34" rx="5" class="release"/>
  <text x="450" y="968" text-anchor="middle" class="node-text">释放 <tspan class="latin">AddrSpace</tspan> 独占锁</text>
  <line x1="450" y1="980" x2="450" y2="989" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="190" y="991" width="520" height="34" rx="5" fill="#f4f6f8" stroke="#cfd8df"/>
    <text x="450" y="1013" text-anchor="middle" class="node-text">返回用户态，重新执行故障指令</text>
  </g>

  <!-- Compact legend for endpoint semantics. -->
  <g transform="translate(289 1044)">
    <circle cx="0" cy="0" r="5" fill="#fff" stroke="#647586" stroke-width="2"/>
    <text x="11" y="4" class="rail-note">获取锁</text>
    <circle cx="93" cy="0" r="5" fill="#647586"/>
    <text x="104" y="4" class="rail-note">释放锁</text>
    <line x1="184" y1="0" x2="214" y2="0" stroke="#647586" stroke-width="7" stroke-linecap="round"/>
    <text x="225" y="4" class="rail-note">持锁区间</text>
  </g>
</svg>
