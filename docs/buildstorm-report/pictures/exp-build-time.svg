<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="KaiTi,STKaiti,楷体,Times New Roman,serif">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498db"/><stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" fill="#fafbfc" rx="4"/>

  <!-- Left Y axis (time) -->
  <line x1="62" y1="30" x2="62" y2="245" stroke="#555" stroke-width="1.5"/>
  <!-- Right Y axis (%) -->
  <line x1="600" y1="30" x2="600" y2="245" stroke="#555" stroke-width="1.5"/>
  <!-- X axis -->
  <line x1="62" y1="245" x2="600" y2="245" stroke="#555" stroke-width="1.5"/>

  <!-- Y grid lines -->
  <line x1="62" y1="245" x2="600" y2="245" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="62" y1="191" x2="600" y2="191" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="62" y1="137" x2="600" y2="137" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="62" y1="84" x2="600" y2="84" stroke="#e0e0e0" stroke-width="0.5"/>
  <line x1="62" y1="30" x2="600" y2="30" stroke="#e0e0e0" stroke-width="0.5"/>

  <!-- Left Y labels (time) -->
  <text x="56" y="249" text-anchor="end" fill="#555" font-size="9">0</text>
  <text x="56" y="195" text-anchor="end" fill="#555" font-size="9">400</text>
  <text x="56" y="141" text-anchor="end" fill="#555" font-size="9">800</text>
  <text x="56" y="87" text-anchor="end" fill="#555" font-size="9">1200</text>
  <text x="56" y="34" text-anchor="end" fill="#555" font-size="9">1600</text>

  <!-- Right Y labels (%) -->
  <text x="606" y="249" fill="#e74c3c" font-size="9">0%</text>
  <text x="606" y="195" fill="#e74c3c" font-size="9">-25%</text>
  <text x="606" y="141" fill="#e74c3c" font-size="9">-50%</text>
  <text x="606" y="87" fill="#e74c3c" font-size="9">-75%</text>

  <!-- Bars: 8 stages, height = time/1600 * 215 -->
  <!-- 00-U:1524.50→205, 01:1058.68→142, 02:1197.38→161, 03:879.17→118, 04:772.47→104, 05:765.18→103, 06:628.53→84, 07-10:460.76→62 -->
  <rect x="75" y="40" width="44" height="205" fill="url(#bar)" rx="2" opacity="0.9"/>
  <text x="97" y="33" text-anchor="middle" fill="#2c3e50" font-size="9" font-weight="bold">1525</text>

  <rect x="133" y="103" width="44" height="142" fill="url(#bar)" rx="2" opacity="0.9"/>
  <text x="155" y="96" text-anchor="middle" fill="#2c3e50" font-size="9">1059</text>

  <rect x="191" y="84" width="44" height="161" fill="url(#bar)" rx="2" opacity="0.9"/>
  <text x="213" y="77" text-anchor="middle" fill="#2c3e50" font-size="9">1197</text>

  <rect x="249" y="127" width="44" height="118" fill="url(#bar)" rx="2" opacity="0.9"/>
  <text x="271" y="120" text-anchor="middle" fill="#2c3e50" font-size="9">879</text>

  <rect x="307" y="141" width="44" height="104" fill="url(#bar)" rx="2" opacity="0.9"/>
  <text x="329" y="134" text-anchor="middle" fill="#2c3e50" font-size="9">772</text>

  <rect x="365" y="142" width="44" height="103" fill="url(#bar)" rx="2" opacity="0.9"/>
  <text x="387" y="135" text-anchor="middle" fill="#2c3e50" font-size="9">765</text>

  <rect x="423" y="161" width="44" height="84" fill="url(#bar)" rx="2" opacity="0.9"/>
  <text x="445" y="154" text-anchor="middle" fill="#2c3e50" font-size="9">629</text>

  <rect x="481" y="183" width="44" height="62" fill="#27ae60" rx="2" opacity="0.9"/>
  <text x="503" y="176" text-anchor="middle" fill="#1e8449" font-size="9" font-weight="bold">461</text>

  <!-- Line for relative-to-baseline % -->
  <!-- y = 245 + (%/100) * 215, where 0%→245, -100%→30 -->
  <!-- 00:0→245, 01:-30.56→179, 02:-21.46→199, 03:-42.33→154, 04:-49.33→139, 05:-49.81→138, 06:-58.77→119, 07-10:-69.78→95 -->
  <polyline points="97,245 155,179 213,199 271,154 329,139 387,138 445,119 503,95"
    fill="none" stroke="#e74c3c" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- dots -->
  <circle cx="97" cy="245" r="4" fill="#e74c3c"/>
  <circle cx="155" cy="179" r="4" fill="#e74c3c"/>
  <circle cx="213" cy="199" r="4" fill="#e74c3c"/>
  <circle cx="271" cy="154" r="4" fill="#e74c3c"/>
  <circle cx="329" cy="139" r="4" fill="#e74c3c"/>
  <circle cx="387" cy="138" r="4" fill="#e74c3c"/>
  <circle cx="445" cy="119" r="4" fill="#e74c3c"/>
  <circle cx="503" cy="95" r="4" fill="#e74c3c"/>

  <!-- Percentage labels near dots -->
  <text x="97" y="238" text-anchor="middle" fill="#e74c3c" font-size="8">0%</text>
  <text x="155" y="172" text-anchor="middle" fill="#e74c3c" font-size="8">-31%</text>
  <text x="213" y="192" text-anchor="middle" fill="#e74c3c" font-size="8">-21%</text>
  <text x="271" y="147" text-anchor="middle" fill="#e74c3c" font-size="8">-42%</text>
  <text x="329" y="132" text-anchor="middle" fill="#e74c3c" font-size="8">-49%</text>
  <text x="387" y="131" text-anchor="middle" fill="#e74c3c" font-size="8">-50%</text>
  <text x="445" y="112" text-anchor="middle" fill="#e74c3c" font-size="8">-59%</text>
  <text x="503" y="88" text-anchor="middle" fill="#e74c3c" font-size="8">-70%</text>

  <!-- X labels -->
  <text x="97" y="261" text-anchor="middle" fill="#555" font-size="8.5">00-U</text>
  <text x="155" y="261" text-anchor="middle" fill="#555" font-size="8.5">01</text>
  <text x="213" y="261" text-anchor="middle" fill="#555" font-size="8.5">02</text>
  <text x="271" y="261" text-anchor="middle" fill="#555" font-size="8.5">03</text>
  <text x="329" y="261" text-anchor="middle" fill="#555" font-size="8.5">04</text>
  <text x="387" y="261" text-anchor="middle" fill="#555" font-size="8.5">05</text>
  <text x="445" y="261" text-anchor="middle" fill="#555" font-size="8.5">06</text>
  <text x="503" y="261" text-anchor="middle" fill="#555" font-size="8.5">07-10</text>

  <!-- Legend -->
  <rect x="72" y="275" width="10" height="10" fill="#3498db" rx="1"/>
  <text x="87" y="284" fill="#555" font-size="9">编译耗时 (s) — 柱，左轴</text>
  <line x1="195" y1="280" x2="218" y2="280" stroke="#e74c3c" stroke-width="2"/>
  <circle cx="207" cy="280" r="3" fill="#e74c3c"/>
  <text x="224" y="284" fill="#555" font-size="9">相对基线 (%) — 折线，右轴</text>
</svg>