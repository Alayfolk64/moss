<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" role="img" aria-labelledby="title desc">
  <title id="title">Time with six to eight CPU cores active</title>
  <desc id="desc">Percentage of measured time during which six to eight cores were active at each optimization stage.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #243447; }
    .muted { fill: #607080; }
    .grid { stroke: #d9e1e8; stroke-width: 1; }
    .axis { stroke: #647586; stroke-width: 1.25; }
    .bar { fill: #2f8f83; }
    .final { fill: #176b61; }
  </style>
  <rect width="700" height="390" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700">High Parallelism by Optimization Stage</text>
  <text x="350" y="52" text-anchor="middle" font-size="11" class="muted">Share of time with 6–8 CPU cores active</text>
  <!-- Plot area: x=78..640, y=82..300; scale 0..50%. -->
  <line x1="78" y1="300" x2="640" y2="300" class="grid"/><line x1="78" y1="256.4" x2="640" y2="256.4" class="grid"/>
  <line x1="78" y1="212.8" x2="640" y2="212.8" class="grid"/><line x1="78" y1="169.2" x2="640" y2="169.2" class="grid"/>
  <line x1="78" y1="125.6" x2="640" y2="125.6" class="grid"/><line x1="78" y1="82" x2="640" y2="82" class="grid"/>
  <line x1="78" y1="82" x2="78" y2="300" class="axis"/><line x1="78" y1="300" x2="640" y2="300" class="axis"/>
  <g font-size="11" text-anchor="end" class="muted">
    <text x="66" y="304">0%</text><text x="66" y="260">10%</text><text x="66" y="217">20%</text>
    <text x="66" y="173">30%</text><text x="66" y="130">40%</text><text x="66" y="86">50%</text>
  </g>
  <text x="24" y="191" text-anchor="middle" font-size="11" class="muted" transform="rotate(-90 24 191)">Time with 6–8 cores active (%)</text>
  <!-- Values: 6.23, 22.38, 17.70, 32.61, 32.21, 31.46, 42.93. -->
  <rect x="101" y="272.9" width="50" height="27.1" rx="3" class="bar"/><rect x="174" y="202.4" width="50" height="97.6" rx="3" class="bar"/>
  <rect x="247" y="222.9" width="50" height="77.1" rx="3" class="bar"/><rect x="320" y="157.7" width="50" height="142.3" rx="3" class="bar"/>
  <rect x="393" y="159.5" width="50" height="140.5" rx="3" class="bar"/><rect x="466" y="162.8" width="50" height="137.2" rx="3" class="bar"/>
  <rect x="539" y="112.4" width="50" height="187.6" rx="3" class="final"/>
  <g font-size="11" text-anchor="middle" font-weight="700">
    <text x="126" y="264">6.23%</text><text x="199" y="194">22.38%</text><text x="272" y="215">17.70%</text>
    <text x="345" y="149">32.61%</text><text x="418" y="151">32.21%</text><text x="491" y="155">31.46%</text><text x="564" y="104" fill="#176b61">42.93%</text>
  </g>
  <g font-size="11" text-anchor="middle" class="muted">
    <text x="126" y="322">00-U</text><text x="199" y="322">01</text><text x="272" y="322">02</text><text x="345" y="322">03</text>
    <text x="418" y="322">04</text><text x="491" y="322">05</text><text x="564" y="322">06</text>
  </g>
  <text x="350" y="348" text-anchor="middle" font-size="11" class="muted">Optimization stage</text>
</svg>
