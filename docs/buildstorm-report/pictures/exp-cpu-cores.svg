<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="KaiTi,STKaiti,楷体,Times New Roman,serif">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ecc71"/><stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
  </defs>
  <rect width="600" height="260" fill="#fafbfc" rx="4"/>

  <line x1="60" y1="30" x2="60" y2="210" stroke="#555" stroke-width="1.5"/>
  <line x1="60" y1="210" x2="580" y2="210" stroke="#555" stroke-width="1.5"/>

  <!-- Y grid and labels -->
  <line x1="60" y1="210" x2="580" y2="210" stroke="#e8e8e8" stroke-width="0.5"/>
  <line x1="60" y1="165" x2="580" y2="165" stroke="#e8e8e8" stroke-width="0.5"/>
  <line x1="60" y1="120" x2="580" y2="120" stroke="#e8e8e8" stroke-width="0.5"/>
  <line x1="60" y1="75" x2="580" y2="75" stroke="#e8e8e8" stroke-width="0.5"/>
  <line x1="60" y1="30" x2="580" y2="30" stroke="#e8e8e8" stroke-width="0.5"/>

  <text x="52" y="214" text-anchor="end" fill="#555" font-size="9">0</text>
  <text x="52" y="169" text-anchor="end" fill="#555" font-size="9">10</text>
  <text x="52" y="124" text-anchor="end" fill="#555" font-size="9">20</text>
  <text x="52" y="79" text-anchor="end" fill="#555" font-size="9">30</text>
  <text x="52" y="34" text-anchor="end" fill="#555" font-size="9">40</text>

  <!-- Bars: 6-8核占比%. Height = %/50 * 180 -->
  <!-- 00-U:6.23→22, 01:22.38→81, 02:17.70→64, 03:32.61→117, 04:32.21→116, 05:31.46→113, 06:42.93→155 -->
  <rect x="75" y="188" width="44" height="22" fill="url(#b)" rx="2" opacity="0.9"/>
  <text x="97" y="181" text-anchor="middle" fill="#2c3e50" font-size="9">6.2</text>

  <rect x="140" y="129" width="44" height="81" fill="url(#b)" rx="2" opacity="0.9"/>
  <text x="162" y="122" text-anchor="middle" fill="#2c3e50" font-size="9">22.4</text>

  <rect x="205" y="146" width="44" height="64" fill="url(#b)" rx="2" opacity="0.9"/>
  <text x="227" y="139" text-anchor="middle" fill="#2c3e50" font-size="9">17.7</text>

  <rect x="270" y="93" width="44" height="117" fill="url(#b)" rx="2" opacity="0.9"/>
  <text x="292" y="86" text-anchor="middle" fill="#2c3e50" font-size="9">32.6</text>

  <rect x="335" y="94" width="44" height="116" fill="url(#b)" rx="2" opacity="0.9"/>
  <text x="357" y="87" text-anchor="middle" fill="#2c3e50" font-size="9">32.2</text>

  <rect x="400" y="97" width="44" height="113" fill="url(#b)" rx="2" opacity="0.9"/>
  <text x="422" y="90" text-anchor="middle" fill="#2c3e50" font-size="9">31.5</text>

  <rect x="465" y="55" width="44" height="155" fill="#1abc9c" rx="2" opacity="0.9"/>
  <text x="487" y="48" text-anchor="middle" fill="#16a085" font-size="10" font-weight="bold">42.9</text>

  <!-- X labels -->
  <text x="97" y="226" text-anchor="middle" fill="#555" font-size="8.5">00-U</text>
  <text x="162" y="226" text-anchor="middle" fill="#555" font-size="8.5">01</text>
  <text x="227" y="226" text-anchor="middle" fill="#555" font-size="8.5">02</text>
  <text x="292" y="226" text-anchor="middle" fill="#555" font-size="8.5">03</text>
  <text x="357" y="226" text-anchor="middle" fill="#555" font-size="8.5">04</text>
  <text x="422" y="226" text-anchor="middle" fill="#555" font-size="8.5">05</text>
  <text x="487" y="226" text-anchor="middle" fill="#555" font-size="8.5">06</text>

  <text x="320" y="248" text-anchor="middle" fill="#888" font-size="9">6～8 核时间占比 (%) — 越高说明更多核被同时利用</text>
</svg>