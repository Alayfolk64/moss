  <text class="small" x="76" y="540" text-anchor="middle" fill="#25824a">局部区间</text>
  <g filter="url(#shadow)">
    <rect class="node" x="160" y="403" width="170" height="70" rx="9" fill="#f8fafc" stroke="#94a3b8"/>
    <text class="node-text latin" x="245" y="432" text-anchor="middle" fill="#334155">mprotect</text><text class="small" x="245" y="457" text-anchor="middle" fill="#334155">权限修改请求</text>
    <rect class="node" x="390" y="403" width="170" height="70" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="node-text" x="475" y="432" text-anchor="middle" fill="#69428b">获取 <tspan class="latin">AddrSpace</tspan></text><text class="small" x="475" y="457" text-anchor="middle" fill="#69428b">写锁</text>
    <rect class="node" x="620" y="403" width="170" height="70" rx="9" fill="#edf5ff" stroke="#5d8ec4"/>
    <text class="node-text" x="705" y="432" text-anchor="middle" fill="#356a9c">定位目标区间</text><text class="small" x="705" y="457" text-anchor="middle" fill="#356a9c">覆盖的 <tspan class="latin">VMA</tspan></text>
    <rect class="node" x="850" y="403" width="170" height="70" rx="9" fill="#edf5ff" stroke="#5d8ec4"/>
    <text class="node-text" x="935" y="432" text-anchor="middle" fill="#356a9c">第一遍校验</text><text class="small latin" x="935" y="457" text-anchor="middle" fill="#356a9c">may_flags</text>

    <rect class="node" x="850" y="563" width="170" height="70" rx="9" fill="#e7f8ed" stroke="#48a86b"/>
