  <path class="arrow" d="M330 90 H382"/><path class="arrow" d="M560 90 H612"/><path class="arrow" d="M790 90 H842"/>
  <path class="arrow" d="M935 125 V207"/><path class="arrow" d="M850 250 H798"/><path class="arrow" d="M620 250 H568"/><path class="arrow" d="M390 250 H338"/>

