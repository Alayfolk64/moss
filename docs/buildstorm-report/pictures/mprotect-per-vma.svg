    <text class="node-text" x="475" y="592" text-anchor="middle" fill="#25824a">分裂边界</text><text class="small" x="475" y="617" text-anchor="middle" fill="#25824a">更新元数据</text>
    <rect class="node" x="160" y="563" width="170" height="70" rx="9" fill="#e7f8ed" stroke="#48a86b"/>
    <text class="node-text" x="245" y="592" text-anchor="middle" fill="#25824a">合并相邻 <tspan class="latin">VMA</tspan></text><text class="small" x="245" y="617" text-anchor="middle" fill="#25824a">释放写锁</text>
