    <rect class="node" x="620" y="563" width="170" height="70" rx="9" fill="#fff4e8" stroke="#cf813c"/>
    <text class="node-text latin" x="705" y="592" text-anchor="middle" fill="#9a571f">TLB shootdown</text><text class="small" x="705" y="617" text-anchor="middle" fill="#9a571f">完成页表更新</text>
