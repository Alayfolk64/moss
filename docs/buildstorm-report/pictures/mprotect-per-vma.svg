<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#64748b" flood-opacity="0.16"/></filter>
    <style>
      text { font-family: KaiTi, STKaiti, 楷体, serif; }
      .latin { font-family: "Times New Roman", Times, serif; }
      .row { stroke-width: 1.5; }
      .node { stroke-width: 1.5; }
      .row-label { font-size: 22px; font-weight: 700; }
      .node-text { font-size: 20px; }
      .small { font-size: 18px; }
      .code { font-size: 16px; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="700" rx="10" fill="#ffffff"/>

  <!-- old path, wrapped -->
  <rect class="row" x="12" y="16" width="1096" height="320" rx="12" fill="#fff8f7" stroke="#f1b6ae"/>
  <rect x="24" y="126" width="104" height="100" rx="10" fill="#fff0ee" stroke="#df6b5d" stroke-width="1.5"/>
  <text class="row-label" x="76" y="165" text-anchor="middle" fill="#b84437">旧链路</text>
  <text class="small" x="76" y="192" text-anchor="middle" fill="#b84437">全局扫描</text>
  <g filter="url(#shadow)">
