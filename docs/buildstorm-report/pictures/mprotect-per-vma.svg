  <rect class="row" x="12" y="364" width="1096" height="320" rx="12" fill="#f5fbf7" stroke="#a9d9b9"/>
  <rect x="24" y="474" width="104" height="100" rx="10" fill="#e9f8ef" stroke="#48a86b" stroke-width="1.5"/>
