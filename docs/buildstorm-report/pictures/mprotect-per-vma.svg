    <rect class="node" x="620" y="55" width="170" height="70" rx="9" fill="#fff1ef" stroke="#df6b5d"/>
    <text class="node-text" x="705" y="84" text-anchor="middle" fill="#b84437">锁住全局记录表</text><text class="small latin" x="705" y="109" text-anchor="middle" fill="#b84437">MMAP_RECORDS</text>
    <rect class="node" x="850" y="55" width="170" height="70" rx="9" fill="#ffe5e1" stroke="#d65243"/>
    <text class="node-text" x="935" y="84" text-anchor="middle" fill="#aa362b">扫描全部记录</text><text class="small" x="935" y="109" text-anchor="middle" fill="#aa362b">校验权限上限</text>

    <rect class="node" x="850" y="215" width="170" height="70" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="node-text" x="935" y="244" text-anchor="middle" fill="#69428b">修改目标 <tspan class="latin">PTE</tspan></text><text class="small" x="935" y="269" text-anchor="middle" fill="#69428b">更新页表权限</text>
    <rect class="node" x="620" y="215" width="170" height="70" rx="9" fill="#fff1ef" stroke="#df6b5d"/>
    <text class="node-text" x="705" y="244" text-anchor="middle" fill="#b84437">再次锁住</text><text class="small" x="705" y="269" text-anchor="middle" fill="#b84437">全局记录表</text>
    <rect class="node" x="390" y="215" width="170" height="70" rx="9" fill="#ffe5e1" stroke="#d65243"/>
    <text class="node-text" x="475" y="244" text-anchor="middle" fill="#aa362b">再次全量扫描</text><text class="small" x="475" y="269" text-anchor="middle" fill="#aa362b">重建记录表</text>
    <rect class="node" x="160" y="215" width="170" height="70" rx="9" fill="#f2eafb" stroke="#8e63b0"/>
    <text class="node-text" x="245" y="256" text-anchor="middle" fill="#69428b">释放写锁</text>
