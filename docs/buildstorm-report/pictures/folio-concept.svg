<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="KaiTi,STKaiti,楷体,Times New Roman,serif">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fcfcfc" rx="2"/>

  <!-- ===== LEFT PANEL: Old single-page ===== -->
  <rect x="20" y="10" width="290" height="220" rx="6" fill="#fef5f5" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="165" y="34" text-anchor="middle" fill="#c0392b" font-size="13" font-weight="bold">旧实现：逐页缓存（4 KiB）</text>

  <!-- Page 0 -->
  <rect x="50" y="52" width="50" height="40" rx="3" fill="#fff" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="75" y="77" text-anchor="middle" fill="#c0392b" font-size="11">P0</text>
  <line x1="100" y1="72" x2="158" y2="72" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="130" y="68" text-anchor="middle" fill="#c0392b" font-size="9">I/O</text>

  <!-- Page 1 -->
  <rect x="50" y="100" width="50" height="40" rx="3" fill="#fff" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="75" y="125" text-anchor="middle" fill="#c0392b" font-size="11">P1</text>
  <line x1="100" y1="120" x2="158" y2="120" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="130" y="116" text-anchor="middle" fill="#c0392b" font-size="9">I/O</text>

  <!-- Page 2 -->
  <rect x="50" y="148" width="50" height="40" rx="3" fill="#fff" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="75" y="173" text-anchor="middle" fill="#c0392b" font-size="11">P2</text>
  <line x1="100" y1="168" x2="158" y2="168" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="130" y="164" text-anchor="middle" fill="#c0392b" font-size="9">I/O</text>

  <!-- Page 3 -->
  <rect x="50" y="196" width="50" height="30" rx="3" fill="#fff" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="75" y="215" text-anchor="middle" fill="#c0392b" font-size="11">...</text>

  <!-- Disk icon for old approach -->
  <rect x="168" y="48" width="130" height="180" rx="6" fill="#fdf2f2" stroke="#e74c3c" stroke-width="0.8" stroke-dasharray="4,2"/>
  <text x="233" y="142" text-anchor="middle" fill="#c0392b" font-size="10">4 次磁盘 I/O</text>
  <text x="233" y="158" text-anchor="middle" fill="#c0392b" font-size="10">逐页查询</text>
  <text x="233" y="174" text-anchor="middle" fill="#c0392b" font-size="10">逐页 LRU</text>

  <!-- ===== RIGHT PANEL: Folio ===== -->
  <rect x="330" y="10" width="290" height="220" rx="6" fill="#eef6fc" stroke="#2980b9" stroke-width="1.5"/>
  <text x="475" y="34" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="bold">优化后：Folio 批量加载（order = 2）</text>

  <!-- Folio box with 4 pages grouped -->
  <rect x="370" y="52" width="160" height="160" rx="5" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="450" y="70" text-anchor="middle" fill="#1a5276" font-size="10" font-weight="bold">1 个 Folio（16 KiB）</text>

  <rect x="385" y="80" width="130" height="28" rx="3" fill="#fff" stroke="#2980b9" stroke-width="0.6"/>
  <text x="450" y="99" text-anchor="middle" fill="#1a5276" font-size="10.5">P0</text>

  <rect x="385" y="112" width="130" height="28" rx="3" fill="#fff" stroke="#2980b9" stroke-width="0.6"/>
  <text x="450" y="131" text-anchor="middle" fill="#1a5276" font-size="10.5">P1</text>

  <rect x="385" y="144" width="130" height="28" rx="3" fill="#fff" stroke="#2980b9" stroke-width="0.6"/>
  <text x="450" y="163" text-anchor="middle" fill="#1a5276" font-size="10.5">P2</text>

  <rect x="385" y="176" width="130" height="26" rx="3" fill="#fff" stroke="#2980b9" stroke-width="0.6" stroke-dasharray="3,2"/>
  <text x="450" y="193" text-anchor="middle" fill="#2980b9" font-size="10">...</text>

  <!-- Single I/O arrow -->
  <line x1="530" y1="132" x2="588" y2="132" stroke="#2980b9" stroke-width="2" marker-end="url(#arr)"/>
  <text x="560" y="126" text-anchor="middle" fill="#1a5276" font-size="9.5">1 次</text>
  <text x="560" y="140" text-anchor="middle" fill="#1a5276" font-size="9.5">I/O</text>

  <!-- Disk icon for folio -->
  <rect x="593" y="80" width="20" height="105" rx="6" fill="#2980b9" opacity="0.15" stroke="#2980b9" stroke-width="0.6"/>

  <!-- ===== BOTTOM: Folio lookup states ===== -->
  <text x="320" y="252" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">查找 Folio 时的三种状态（由 `FolioState` 字段决定）</text>

  <!-- Branch lines from a central point -->
  <line x1="320" y1="262" x2="320" y2="278" stroke="#555" stroke-width="1"/>
  <line x1="60" y1="278" x2="580" y2="278" stroke="#555" stroke-width="1"/>
  <line x1="60" y1="278" x2="60" y2="290" stroke="#555" stroke-width="1"/>
  <line x1="320" y1="278" x2="320" y2="290" stroke="#555" stroke-width="1"/>
  <line x1="580" y1="278" x2="580" y2="290" stroke="#555" stroke-width="1"/>

  <!-- State 1: uptodate (ready) -->
  <rect x="20" y="292" width="195" height="55" rx="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.3"/>
  <text x="117" y="313" text-anchor="middle" fill="#1e8449" font-size="11.5" font-weight="bold">① uptodate = true</text>
  <text x="117" y="332" text-anchor="middle" fill="#1e8449" font-size="10.5">Folio 数据已就绪，直接返回引用</text>
  <text x="117" y="346" text-anchor="middle" fill="#7f8c8d" font-size="9.5">（最快的路径，仅持每页锁）</text>

  <!-- State 2: loading -->
  <rect x="228" y="292" width="185" height="55" rx="5" fill="#fef9e7" stroke="#f39c12" stroke-width="1.3"/>
  <text x="320" y="313" text-anchor="middle" fill="#7d6608" font-size="11.5" font-weight="bold">② loading = true</text>
  <text x="320" y="332" text-anchor="middle" fill="#7d6608" font-size="10.5">Folio 正在由 loader 读盘</text>
  <text x="320" y="346" text-anchor="middle" fill="#7f8c8d" font-size="9.5">→ 释放锁 → 等待 → 重新校验</text>

  <!-- State 3: miss (not exists) -->
  <rect x="426" y="292" width="195" height="55" rx="5" fill="#fdf2f2" stroke="#e74c3c" stroke-width="1.3"/>
  <text x="523" y="313" text-anchor="middle" fill="#c0392b" font-size="11.5" font-weight="bold">③ 缓存未命中</text>
  <text x="523" y="332" text-anchor="middle" fill="#c0392b" font-size="10.5">创建新 Folio，置 loading = true</text>
  <text x="523" y="346" text-anchor="middle" fill="#7f8c8d" font-size="9.5">→ 发起磁盘 I/O → 完成置 uptodate</text>

  <!-- ===== Footnote ===== -->
  <text x="320" y="370" text-anchor="middle" fill="#888" font-size="9.5">`FolioState` 还包含 `truncated`、`dirty`、`writeback`、`error` 等字段，分别处理截断失效、脏页回写和 I/O 错误。</text>
  <text x="320" y="388" text-anchor="middle" fill="#888" font-size="9.5">最大 order = 4（64 KiB / 16 页），BuildStorm 顺序读场景下 order = 2（16 KiB / 4 页）为主。</text>
</svg>
