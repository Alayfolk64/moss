<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" font-family="KaiTi,STKaiti,楷体,Times New Roman,serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4 Z" fill="#888"/></marker>
  </defs>
  <rect width="620" height="170" fill="#fcfcfc" rx="2"/>

  <!-- ===== OLD PATH ===== -->
  <rect x="10" y="14" width="600" height="62" rx="6" fill="#fef5f5" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="22" y="34" fill="#c0392b" font-size="12" font-weight="bold">旧</text>

  <rect x="40" y="24" width="92" height="40" rx="4" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="86" y="41" text-anchor="middle" fill="#6c3483" font-size="11">Thread A</text>
  <text x="86" y="57" text-anchor="middle" fill="#6c3483" font-size="11">获取设备锁</text>

  <line x1="132" y1="44" x2="148" y2="44" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="152" y="26" width="96" height="36" rx="4" fill="#fff" stroke="#8e44ad" stroke-width="1.3"/>
  <text x="200" y="42" text-anchor="middle" fill="#6c3483" font-size="11">提交块设备</text>
  <text x="200" y="56" text-anchor="middle" fill="#6c3483" font-size="11">I/O 请求</text>

  <line x1="248" y1="44" x2="264" y2="44" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="268" y="24" width="100" height="40" rx="4" fill="#fdf2f2" stroke="#e74c3c" stroke-width="1.8"/>
  <text x="318" y="41" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">同步等待</text>
  <text x="318" y="57" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">磁盘 I/O</text>

  <line x1="368" y1="44" x2="384" y2="44" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="388" y="28" width="72" height="32" rx="4" fill="#ddd" stroke="#aaa" stroke-width="1"/>
  <text x="424" y="49" text-anchor="middle" fill="#444" font-size="11">释放锁</text>

  <text x="478" y="38" fill="#c0392b" font-size="10">持锁等盘，一次只有</text>
  <text x="478" y="54" fill="#c0392b" font-size="10">一个请求在设备上</text>

  <!-- ===== NEW PATH ===== -->
  <rect x="10" y="94" width="600" height="62" rx="6" fill="#f0faf3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="22" y="114" fill="#1e8449" font-size="12" font-weight="bold">新</text>

  <rect x="40" y="104" width="92" height="40" rx="4" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="86" y="121" text-anchor="middle" fill="#6c3483" font-size="11">Thread A</text>
  <text x="86" y="137" text-anchor="middle" fill="#6c3483" font-size="11">获取设备锁</text>

  <line x1="132" y1="124" x2="148" y2="124" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="152" y="104" width="120" height="40" rx="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.3"/>
  <text x="212" y="121" text-anchor="middle" fill="#1a5276" font-size="10.5">请求放入 VirtIO</text>
  <text x="212" y="137" text-anchor="middle" fill="#1a5276" font-size="10.5">队列，通知设备</text>

  <line x1="272" y1="124" x2="286" y2="124" stroke="#27ae60" stroke-width="2" marker-end="url(#a)"/>

  <rect x="290" y="104" width="108" height="40" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="344" y="121" text-anchor="middle" fill="#1e8449" font-size="10.5">释放设备锁</text>
  <text x="344" y="137" text-anchor="middle" fill="#1e8449" font-size="10.5">Completion 等待</text>

  <line x1="398" y1="124" x2="416" y2="124" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#a)"/>

  <rect x="420" y="106" width="92" height="36" rx="4" fill="#fdebd0" stroke="#e67e22" stroke-width="1.3"/>
  <text x="466" y="122" text-anchor="middle" fill="#a04000" font-size="10">I/O 完成</text>
  <text x="466" y="136" text-anchor="middle" fill="#a04000" font-size="10">唤醒 Thread A</text>

  <text x="526" y="118" fill="#1e8449" font-size="10">最多 16 个请求</text>
  <text x="526" y="134" fill="#1e8449" font-size="10">同时在途并发</text>
</svg>
