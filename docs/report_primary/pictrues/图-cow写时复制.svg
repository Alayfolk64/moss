<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .zh { font-family: 'Source Han Sans CN','Microsoft YaHei','PingFang SC',sans-serif; }
    .mono { font-family: Consolas,'Courier New',monospace; }
    .title { font-size: 16px; font-weight: 700; fill: #1e293b; }
    .label { font-size: 13px; font-weight: 600; fill: #334155; }
    .small { font-size: 12px; fill: #475569; }
    .tiny { font-size: 11px; fill: #64748b; }
  </style>

  <!-- shared state after fork -->
  <text x="42" y="42" class="zh title">fork 后：同一物理页，写权限移除</text>
  <rect x="42" y="66" width="172" height="112" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="128" y="94" text-anchor="middle" class="zh title">父进程页表</text>
  <rect x="66" y="112" width="124" height="40" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="128" y="137" text-anchor="middle" class="mono label">VA → P, R--</text>

  <rect x="42" y="210" width="172" height="112" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="128" y="238" text-anchor="middle" class="zh title">子进程页表</text>
  <rect x="66" y="256" width="124" height="40" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="128" y="281" text-anchor="middle" class="mono label">VA → P, R--</text>

  <rect x="286" y="139" width="154" height="116" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="363" y="172" text-anchor="middle" class="zh title">物理页 P</text>
  <line x1="310" y1="188" x2="416" y2="188" stroke="#fbbf24"/>
  <text x="363" y="216" text-anchor="middle" class="mono label">RC = 2</text>
  <line x1="190" y1="132" x2="284" y2="173" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <line x1="190" y1="276" x2="284" y2="220" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>

  <!-- fault and branching -->
  <line x1="214" y1="266" x2="505" y2="266" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="355" y="256" text-anchor="middle" class="zh small" fill="#dc2626">写缺页</text>
  <rect x="506" y="235" width="116" height="62" rx="31" fill="#fee2e2" stroke="#f87171" stroke-width="1.4"/>
  <text x="564" y="261" text-anchor="middle" class="zh label">查询</text>
  <text x="564" y="281" text-anchor="middle" class="mono label">RC</text>

  <line x1="622" y1="252" x2="666" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="622" y1="280" x2="666" y2="341" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="639" y="184" class="mono tiny">RC = 1</text>
  <text x="639" y="326" class="mono tiny">RC &gt; 1</text>

  <!-- unique-page branch -->
  <rect x="668" y="72" width="210" height="118" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.4"/>
  <text x="773" y="102" text-anchor="middle" class="zh title">直接恢复写权限</text>
  <rect x="700" y="122" width="146" height="40" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="773" y="147" text-anchor="middle" class="mono label">VA → P, RW-</text>

  <!-- copy branch -->
  <rect x="668" y="268" width="210" height="142" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.4"/>
  <text x="773" y="296" text-anchor="middle" class="zh title">复制并改映射</text>
  <rect x="690" y="316" width="66" height="52" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="723" y="338" text-anchor="middle" class="mono small">旧页 P</text>
  <text x="723" y="355" text-anchor="middle" class="mono tiny">RC − 1</text>
  <line x1="758" y1="342" x2="792" y2="342" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="796" y="316" width="60" height="52" rx="6" fill="#dcfce7" stroke="#4ade80"/>
  <text x="826" y="338" text-anchor="middle" class="zh small">新页</text>
  <text x="826" y="355" text-anchor="middle" class="mono tiny">P′</text>
  <rect x="690" y="378" width="166" height="22" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="773" y="394" text-anchor="middle" class="mono tiny">当前 PTE → P′, RW-</text>
</svg>
