<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .zh { font-family: 'Source Han Sans CN','Microsoft YaHei','PingFang SC',sans-serif; }
    .mono { font-family: Consolas,'Courier New',monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .label { font-size: 15px; font-weight: 600; fill: #334155; }
    .small { font-size: 14px; fill: #475569; }
    .tiny { font-size: 12px; fill: #64748b; }
  </style>

  <!-- virtual address fields -->
  <text x="38" y="34" class="zh title">虚拟地址</text>
  <rect x="130" y="15" width="160" height="42" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="290" y="15" width="160" height="42" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="450" y="15" width="160" height="42" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="610" y="15" width="190" height="42" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="210" y="41" text-anchor="middle" class="mono label">VPN[2]</text>
  <text x="370" y="41" text-anchor="middle" class="mono label">VPN[1]</text>
  <text x="530" y="41" text-anchor="middle" class="mono label">VPN[0]</text>
  <text x="705" y="41" text-anchor="middle" class="zh label">页内偏移</text>

  <!-- satp and table walk -->
  <rect x="36" y="142" width="108" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="90" y="167" text-anchor="middle" class="mono title">satp</text>
  <text x="90" y="186" text-anchor="middle" class="zh small">根表物理页号</text>

  <g>
    <rect x="190" y="108" width="132" height="126" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
    <rect x="190" y="108" width="132" height="32" rx="8" fill="#e0f2fe"/>
    <text x="256" y="130" text-anchor="middle" class="zh label">根页表（L2）</text>
    <line x1="201" y1="158" x2="311" y2="158" stroke="#cbd5e1"/>
    <rect x="201" y="170" width="110" height="26" rx="3" fill="#bfdbfe"/>
    <line x1="201" y1="208" x2="311" y2="208" stroke="#cbd5e1"/>
    <text x="256" y="188" text-anchor="middle" class="zh small">下一表 PPN</text>
  </g>
  <g>
    <rect x="394" y="108" width="132" height="126" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
    <rect x="394" y="108" width="132" height="32" rx="8" fill="#e0f2fe"/>
    <text x="460" y="130" text-anchor="middle" class="zh label">二级页表（L1）</text>
    <line x1="405" y1="158" x2="515" y2="158" stroke="#cbd5e1"/>
    <rect x="405" y="170" width="110" height="26" rx="3" fill="#bfdbfe"/>
    <line x1="405" y1="208" x2="515" y2="208" stroke="#cbd5e1"/>
    <text x="460" y="188" text-anchor="middle" class="zh small">下一表 PPN</text>
  </g>
  <g>
    <rect x="598" y="108" width="132" height="126" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.4"/>
    <rect x="598" y="108" width="132" height="32" rx="8" fill="#e0f2fe"/>
    <text x="664" y="130" text-anchor="middle" class="zh label">叶子页表（L0）</text>
    <line x1="609" y1="158" x2="719" y2="158" stroke="#cbd5e1"/>
    <rect x="609" y="170" width="110" height="26" rx="3" fill="#bfdbfe"/>
    <line x1="609" y1="208" x2="719" y2="208" stroke="#cbd5e1"/>
    <text x="664" y="188" text-anchor="middle" class="zh small">PPN + 权限位</text>
  </g>

  <line x1="144" y1="171" x2="188" y2="171" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <line x1="322" y1="183" x2="392" y2="183" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <line x1="526" y1="183" x2="596" y2="183" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="357" y="169" text-anchor="middle" class="mono tiny">VPN[2]</text>
  <text x="561" y="169" text-anchor="middle" class="mono tiny">VPN[1]</text>
  <text x="766" y="169" text-anchor="middle" class="mono tiny">VPN[0]</text>

  <!-- physical address -->
  <path d="M664 234 L664 288 L510 288 L510 324" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M705 57 L705 324" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="500" y="277" text-anchor="end" class="zh tiny">叶子项取出 PPN</text>
  <text x="720" y="184" class="zh tiny" fill="#b45309">偏移</text>
  <text x="38" y="346" class="zh title">物理地址</text>
  <rect x="130" y="326" width="480" height="44" rx="5" fill="#dcfce7" stroke="#4ade80"/>
  <rect x="610" y="326" width="190" height="44" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="370" y="353" text-anchor="middle" class="mono label">物理页号 PPN</text>
  <text x="705" y="353" text-anchor="middle" class="zh label">页内偏移</text>
</svg>
